<!DOCTYPE html><html lang="lt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mokslo nuotykiai | 4 klasė</title><style>
:root{--ink:#172d43;--muted:#53697d;--blue:#225f91;--bg:#eff5f7;--line:#d7e3e8;--green:#19684f;--gold:#a45c13}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 system-ui,sans-serif}header{background:#193d55;color:white;padding:24px 20px}header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.wrap,main{max-width:850px;margin:auto}h1,h2,h3,p{margin:0 0 14px}h1{font-size:28px;line-height:1.15}h2{font-size:25px}h3{font-size:19px}small,.muted{color:var(--muted);font-size:14px}header small{color:#d8eaf3}main{padding:24px 16px 50px}.panel{background:#fff;border:1px solid var(--line);border-radius:19px;padding:clamp(18px,4vw,32px);margin-bottom:16px;box-shadow:0 5px 18px #1a3b4c08}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.tile{border:1px solid var(--line);border-radius:13px;padding:18px;background:#f7fbfc;text-align:left;color:var(--ink);cursor:pointer;font:inherit;min-height:100px}.tile strong{display:block;font-size:18px;margin-bottom:5px}.tile:hover{border-color:var(--blue)}button,select,input,textarea{font:inherit}button{cursor:pointer;border-radius:10px;padding:11px 17px;border:1px solid transparent;background:var(--blue);color:white;font-weight:650}button.secondary{background:#fff;color:var(--blue);border-color:#b5cad9}button:disabled{opacity:.5;cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #f4ad4b;outline-offset:2px}input,textarea,select{border:1px solid #9eb5c4;border-radius:10px;padding:11px;color:var(--ink);background:white;max-width:100%}input{width:150px}textarea{width:100%;min-height:105px;resize:vertical}.actions,.fields,.top{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.top{justify-content:space-between}.field{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.field label{font-weight:600}.question{font-size:clamp(20px,4vw,26px);font-weight:650;line-height:1.45;margin:22px 0;white-space:pre-line}.tag{font-size:14px;color:var(--blue);font-weight:700}.progress{height:8px;background:#dfe9ef;border-radius:8px;overflow:hidden;margin:12px 0 24px}.progress span{display:block;background:#3185a1;height:100%;transition:width .2s}.note{padding:14px 16px;background:#eef5fb;border-left:4px solid #4783a6;border-radius:8px;margin:14px 0;white-space:pre-line}.good{background:#e8f6ee;border-color:#28845f}.warn{background:#fff4e4;border-color:#bd7c27}.diagram{margin:15px auto;max-width:340px;text-align:center}.diagram svg{width:100%;height:auto;max-height:230px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin:18px 0}.stat{background:#f1f6f9;padding:15px;border-radius:12px}.stat b{display:block;font-size:27px}.review{border-top:1px solid var(--line);padding:12px 0}.review summary{cursor:pointer;font-weight:600}.wrong{color:#a12f2f;text-decoration:line-through}.right{color:var(--green);font-weight:650}.footer{text-align:center;color:var(--muted);font-size:13px;margin-top:25px}.hidden{display:none}a{color:var(--blue)}@media(max-width:500px){.actions button{flex:1}input{width:110px}header{padding:20px 16px}}

[hidden]{display:none!important}header{padding:22px 20px 0}header .nav-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-top:19px;padding-bottom:10px;align-items:center}.nav-tabs button{border:1px solid transparent;background:transparent;color:#d8eaf3;padding:9px 13px;font-size:15px;font-weight:650;white-space:nowrap}.nav-tabs button:hover{background:#ffffff16}.nav-tabs button[aria-current="page"]{background:#fff;color:#193d55}.nav-tabs button:last-child{margin-left:auto}.dict-panel{max-width:740px;margin-inline:auto}.dict-title{margin-bottom:4px}.dict-instruction{color:var(--muted);margin:12px 0 18px}.listen-zone{background:#f0f6fa;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:20px;display:grid;gap:10px;text-align:center}.listen-zone #play{font-size:19px;min-height:58px;width:100%}.listen-extras{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.listen-extras button{font-size:15px;padding:9px 12px}.listen-zone #speechStatus{min-height:1.5em;margin:0}.dict-panel #written{min-height:150px;font-size:19px;padding:15px;line-height:1.55;display:block;margin-top:8px}.dict-panel label[for=written]{font-weight:650}.dict-nav{display:flex;justify-content:space-between;gap:12px;margin-top:20px}.dict-nav button{min-height:46px}.settings-fields{display:grid;gap:18px;margin:20px 0}.settings-fields label{display:grid;gap:6px;font-weight:650}.settings-fields select{width:100%;max-width:400px}.settings-actions{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}.settings-footer{border-top:1px solid var(--line);padding-top:16px;margin-top:24px}.grammar-panel input#ltAnswer{width:100%}@media(max-width:600px){header{padding:17px 12px 0}header .nav-tabs{gap:3px;margin-top:13px}.nav-tabs button{font-size:13px;padding:8px 9px}.nav-tabs button:last-child{margin-left:0}.listen-zone{padding:13px}.dict-panel #written{min-height:140px}.dict-nav button{flex:1}} 
 
.quest-hero{background:linear-gradient(135deg,#e4f4ef,#edf1ff);border:1px solid #cbdedc;border-radius:18px;padding:20px;margin-bottom:16px;display:grid;grid-template-columns:104px 1fr;gap:16px;align-items:center}.pet-art{width:100%;max-width:115px;display:block;margin:auto}.quest-hero h3{margin:0 0 4px}.xp-track{height:10px;background:#fff;border-radius:10px;overflow:hidden;margin:8px 0}.xp-track span{display:block;height:100%;background:#418d79;border-radius:10px}.quest-hero .muted{margin:0}.reward{background:#eaf7ed;border:1px solid #bdddc6;padding:15px;border-radius:13px;margin:16px 0;color:#236442;font-weight:650}.reward.animate{animation:reward-pop .45s ease-out}@keyframes reward-pop{0%{transform:scale(.96);opacity:.6}65%{transform:scale(1.015)}100%{transform:scale(1);opacity:1}}.medals{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.medal{padding:15px;border:1px solid var(--line);border-radius:14px;background:#f8fbfc}.medal.locked{background:#f4f5f6;color:var(--muted)}.medal span{display:block;font-size:29px}.medal b{display:block;margin:5px 0}.challenge{background:#fff8e8;border:1px solid #efdbad;border-radius:14px;padding:18px;margin:16px 0}.challenge h3{margin-bottom:6px}.difficulty-pill{display:inline-block;background:#edf5f8;border-radius:20px;padding:4px 11px;color:#285f7a;font-size:14px;margin:5px 0 15px}.settings-fields input[type=checkbox]{width:20px;height:20px}.settings-fields .checkline{display:flex;align-items:center;gap:10px}.pet-options{display:flex;gap:8px;flex-wrap:wrap}.pet-options button[aria-pressed=true]{outline:2px solid #3185a1;outline-offset:2px}.progress span{transition:width .2s}.no-motion *{animation:none!important;transition:none!important}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media(max-width:500px){.quest-hero{grid-template-columns:78px 1fr;padding:14px;gap:10px}.medals{grid-template-columns:1fr 1fr}}

.shop-wallet{background:#fff8e8;border:1px solid #efdbad;border-radius:16px;padding:18px;margin:16px 0}.shop-wallet strong{font-size:30px;color:#805816;display:block}.prize-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:16px 0}.prize-card{border:1px solid var(--line);border-radius:15px;padding:17px;background:#f8fbfc;display:flex;flex-direction:column;gap:8px}.prize-card h3,.prize-card p{margin:0}.prize-card .prize-icon{font-size:39px;line-height:1.2}.prize-card button{margin-top:auto}.prize-log{border-top:1px solid var(--line);padding:13px 0;overflow-wrap:anywhere}.prize-log p{margin:4px 0}.parent-area{border-top:1px solid var(--line);margin-top:26px;padding-top:18px}.parent-area input{width:100%;max-width:380px}.parent-area label{display:grid;gap:5px;font-size:15px;font-weight:600}.parent-area .actions{margin:10px 0}.parent-area .status{min-height:1.5em}.prize-confirm{background:#f2f8fb;border:1px solid #c6dce8;border-radius:12px;padding:16px;margin:14px 0}.parent-form{display:grid;gap:12px;margin:12px 0}.prize-edit{display:grid;gap:9px;padding:14px 0;border-top:1px solid var(--line)}.prize-edit .toggle-label{display:flex;align-items:center;gap:8px}.prize-edit input[type=checkbox]{width:20px}.parent-area button{max-width:100%}
</style></head><body><header><div class="wrap"><div><h1>Mokslo nuotykiai</h1><small>4 klasė • Kiekviena klaida padeda mokytis</small></div></div><nav class="nav-tabs wrap" aria-label="Pagrindinė navigacija"><button id="home" data-nav="home">Pradžia</button><button id="navMath" data-nav="math">Matematika</button><button id="navLt" data-nav="lt">Lietuvių kalba</button><button id="navDict" data-nav="dict">Diktantai</button><button id="navShop" data-nav="shop">🎁 Prizai</button><button id="navVoice" data-nav="voice">⚙ Nustatymai</button></nav></header><main id="app"></main><main id="voicePage" hidden></main><script>
'use strict';
const r=(a,b)=>Math.floor(Math.random()*(b-a+1))+a, pick=a=>a[r(0,a.length-1)], shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=r(0,i);[a[i],a[j]]=[a[j],a[i]]}return a}, frac=(n,d)=>`${n}/${d}`, money=n=>`${Math.floor(n/100)} Eur ${n%100} ct`, time=n=>`${Math.floor(n/60)} h ${n%60} min`, pad=n=>String(n).padStart(2,'0');
const F=(label,value,type='number')=>({label,value,type});const Q=(question,answer,hint,plan,solution,diagram='')=>({question,fields:Array.isArray(answer)?answer:[F('',answer)],hint,plan,solution,diagram});const T=[];function add(id,topic,level,make){T.push({id,topic,level,make})}
const M='Matavimo vienetai', A='Skaičiavimas', P='Pinigai', L='Laikas', FRC='Trupmenos', G='Geometrija', W='Tekstiniai uždaviniai', V='Greitis ir atstumas', N='Loginės užduotys';
add('add',A,'A',()=>{let a=r(22,480),b=r(15,390),c=r(11,89);return Q(`${a} + ${b} + ${c}` ,a+b+c,'Sudėk po du skaičius.','Pirma sudėk pirmus du, tada pridėk trečią.',`${a} + ${b} = ${a+b}\n${a+b} + ${c} = ${a+b+c}`)});
add('subtract',A,'A',()=>{let a=r(200,900),b=r(30,a-20);return Q(`${a} − ${b}`,a-b,'Atimk šimtus, dešimtis ir vienetus.','Gali suskaidyti antrą skaičių į patogias dalis.',`${a} − ${b} = ${a-b}`)});
add('order',A,'A',()=>{let a=r(3,9),b=r(3,9),c=r(10,90);return Q(`${a} · ${b} + ${c}`,a*b+c,'Daugyba atliekama prieš sudėtį.','Pirma daugink, paskui pridėk.',`${a} · ${b} = ${a*b}\n${a*b} + ${c} = ${a*b+c}`)});
add('divide',A,'A',()=>{let a=r(3,9),b=r(8,90);return Q(`${a*b} : ${a}`,b,'Koks skaičius padaugintas iš daliklio duotų dalinį?','Padalyk dalinį iš daliklio.',`${a*b} : ${a} = ${b}, nes ${b} · ${a} = ${a*b}.`)});
add('remainder',A,'A',()=>{let d=r(3,9),q=r(3,12),m=r(1,d-1);return Q(`Padalyk ${d*q+m} iš ${d}.`,[F('Dalmuo',q),F('Liekana',m)],'Rask didžiausią daliklio kartotinį, neviršijantį dalinio.','Nustatyk, kiek pilnų grupių galima sudaryti ir kiek lieka.',`${d} · ${q} = ${d*q}\n${d*q+m} − ${d*q} = ${m}\nDalmuo ${q}, liekana ${m}.`)});
add('unknown',A,'A',()=>{let a=r(110,390),b=r(60,260);return Q(`□ + ${a} = ${a+b}`,b,'Nežinomą dėmenį rasi iš sumos atėmusi žinomą dėmenį.','Atimk.',`${a+b} − ${a} = ${b}`)});
add('length',M,'A',()=>{let a=r(2,15),b=r(1,9);return Q(`${a} cm ${b} mm = ? mm`,[F('mm',a*10+b)],'1 cm = 10 mm.','Centimetrus paversk milimetrais ir pridėk likusius.',`${a} · 10 + ${b} = ${a*10+b} mm`)});
add('length2',M,'A',()=>{let a=r(2,8),b=r(11,95);return Q(`${a*100+b} cm = ? m ? cm`,[F('m',a),F('cm',b)],'1 m = 100 cm.','Atskirk pilnus šimtus centimetrų.',`${a*100+b} cm = ${a} m ${b} cm`)});
add('mass',M,'A',()=>{let a=r(2,9),b=r(1,9)*100;return Q(`${a} kg ${b} g = ? g`,[F('g',a*1000+b)],'1 kg = 1000 g.','Padaugink kilogramus iš 1000 ir pridėk gramus.',`${a} · 1000 + ${b} = ${a*1000+b} g`)});
add('seconds',L,'A',()=>{let a=r(2,9),b=r(5,55);return Q(`${a} min ${b} s = ? s`,[F('s',a*60+b)],'1 minutė = 60 sekundžių.','Minutes padaugink iš 60, pridėk sekundes.',`${a} · 60 + ${b} = ${a*60+b} s`)});
add('hours',L,'A',()=>{let a=r(1,5),b=r(10,59);return Q(`${a} h ${b} min = ? min`,[F('min',a*60+b)],'1 valanda = 60 minučių.','Valandas paversk minutėmis.',`${a} · 60 + ${b} = ${a*60+b} min`)});
add('calendar',L,'A',()=>{let a=r(2,12);return Q(`Kiek dienų yra per ${a} sav.?`,[F('dienų',a*7)],'Savaitėje yra 7 dienos.','Savaičių skaičių daugink iš 7.',`${a} · 7 = ${a*7} dienų`)});
add('cents',P,'A',()=>{let a=r(110,899);return Q(`${a} ct = ? Eur ? ct`,[F('Eur',Math.floor(a/100)),F('ct',a%100)],'100 ct = 1 Eur.','Atskirk pilnus šimtus centų.',`${a} ct = ${money(a)}`)});
add('moneyadd',P,'A',()=>{let a=r(51,99),b=r(51,99),s=a+b;return Q(`${a} ct + ${b} ct = ? Eur ? ct`,[F('Eur',Math.floor(s/100)),F('ct',s%100)],'Pirma sudėk centus.','Jei susidarė 100 centų, pakeisk juos euru.',`${a} + ${b} = ${s} ct = ${money(s)}`)});
add('fraction',FRC,'B',()=>{let d=pick([3,4,5,6,7,8,9]),n=r(1,d-1),k=r(8,45),a=d*k;return Q(`Rask ${frac(n,d)} skaičiaus ${a}.`,n*k,'Vardiklis rodo, į kiek lygių dalių dalijame; skaitiklis – kiek imame.','Padalyk iš vardiklio, padaugink iš skaitiklio.',`${a} : ${d} = ${k}\n${k} · ${n} = ${n*k}`)});
add('reducefraction',FRC,'B',()=>{let d=pick([3,4,5,6]),n=r(1,d-1),k=r(10,80),a=d*k;return Q(`Skaičių ${a} sumažink jo ${frac(n,d)} dalimi.`,a-n*k,'Rasti skaičiaus dalį ir sumažinti skaičių ta dalimi – skirtingi veiksmai.','Rask nurodytą dalį ir atimk ją iš viso skaičiaus.',`${a} : ${d} · ${n} = ${n*k}\n${a} − ${n*k} = ${a-n*k}`)});
add('fractionmass',FRC,'B',()=>{let d=pick([2,4,5,10]),n=r(1,d-1),b=r(1,8)*50,a=1000/d*n;return Q(`Rask ${frac(n,d)} kg ir ${b} g sumą.`,[F('g',a+b)],'1 kg = 1000 g.','Rask kilogramo dalį gramais, tada pridėk.',`1000 : ${d} · ${n} = ${a} g\n${a} + ${b} = ${a+b} g`)});
add('fractiontime',FRC,'B',()=>{let d=pick([2,3,4,5,6]),n=r(1,d-1),b=r(10,50),a=60/d*n;return Q(`Prie ${frac(n,d)} h pridėk ${b} min.`,[F('min',a+b)],'Valandą sudaro 60 minučių.','Rask valandos dalį ir pridėk minutes.',`60 : ${d} · ${n} = ${a} min\n${a} + ${b} = ${a+b} min`)});
add('quotient',A,'B',()=>{let d=r(4,12),q=r(3,16),a=d*q;return Q(`Dalinys – ${a}, daliklis ${q} kartus mažesnis. Rask dalmenį.`,q,'Dalinys – skaičius, kurį dalijame. Daliklis – skaičius, iš kurio dalijame.','Rask daliklį, po to padalyk dalinį iš jo.',`${a} : ${q} = ${d} (daliklis)\n${a} : ${d} = ${q} (dalmuo)`)});
add('compare',A,'B',()=>{let a=r(12,60),b=r(3,a-1);return Q(`Kiek skaičių ${a} ir ${b} suma didesnė už jų skirtumą?`,2*b,'Reikia apskaičiuoti dvi reikšmes ir jas palyginti.','Rask sumą, skirtumą ir iš sumos atimk skirtumą.',`${a} + ${b} = ${a+b}\n${a} − ${b} = ${a-b}\n${a+b} − ${a-b} = ${2*b}`)});
add('perimeter',G,'B',()=>{let a=r(4,24);return Q(`Kvadrato perimetras – ${4*a} cm. Koks jo kraštinės ilgis?`,[F('cm',a)],'Kvadratas turi keturias lygias kraštines.','Perimetrą padalyk iš 4.',`${4*a} : 4 = ${a} cm`)});
add('area',G,'B',()=>{let a=r(5,18),b=r(3,a-1);return Q(`Stačiakampio ilgis – ${a} cm, plotis – ${b} cm. Koks plotas?`,[F('cm²',a*b)],'Plotui rasti dauginame ilgį iš pločio.','Padaugink abi kraštines.',`${a} · ${b} = ${a*b} cm²`,`<svg viewBox="0 0 260 135" role="img" aria-label="Stačiakampis"><rect x="38" y="30" width="160" height="75" fill="#c8e6f0" stroke="#225f91" stroke-width="2"/><text x="118" y="23" text-anchor="middle">${a} cm</text><text x="204" y="72">${b} cm</text></svg>`)});
add('radius',G,'B',()=>{let a=r(8,45);return Q(`Apskritimo skersmuo – ${a*2} cm. Rask spindulį.`,[F('cm',a)],'Skersmuo – du spinduliai.','Padalyk skersmenį iš 2.',`${a*2} : 2 = ${a} cm`)});
add('sequence',N,'B',()=>{let a=r(12,60),d=r(3,12);return Q(`Rask trūkstamą sekos narį:\n${a}, ${a+d}, □, ${a+3*d}, ${a+4*d}`,a+2*d,'Palygink du gretimus skaičius.','Rask pastovų skirtumą ir pridėk prie antro skaičiaus.',`${a+d} − ${a} = ${d}\n${a+d} + ${d} = ${a+2*d}`)});
add('average',N,'B',()=>{let a=r(12,50),d=r(2,9);return Q(`Rask skaičių ${a-d}, ${a}, ${a+d} vidurkį.`,a,'Vidurkis – suma, padalyta iš skaičių kiekio.','Sudėk tris skaičius, tada padalyk iš 3.',`${a-d} + ${a} + ${a+d} = ${3*a}\n${3*a} : 3 = ${a}`)});
add('difference',W,'B',()=>{let a=r(110,250),b=r(25,60),c=r(20,45);return Q(`Bibliotekoje buvo ${a} knygų. Pirmą dieną skaitytojai pasiskolino ${b}, antrą – ${c}. Kiek knygų liko?`,[F('knygų',a-b-c)],'Kiek knygų iš viso pasiskolino?','Sudėk abiejų dienų kiekius ir atimk iš pradinio kiekio.',`${b} + ${c} = ${b+c}\n${a} − ${b+c} = ${a-b-c}`)});
add('unitprice',P,'B',()=>{let a=r(3,9),p=r(2,8)*25;return Q(`Vienodi sąsiuviniai (${a} vnt.) kainuoja ${money(a*p)}. Kiek kainuoja vienas sąsiuvinis?`,[F('ct',p)],'Visi sąsiuviniai kainuoja vienodai.','Visą kainą paversk centais ir padalyk iš sąsiuvinių skaičiaus.',`${money(a*p)} = ${a*p} ct\n${a*p} : ${a} = ${p} ct`)});
add('elapsed',L,'B',()=>{let a=r(8,14)*60+r(0,5)*10,b=r(4,25)*10;return Q(`Pamoka prasidėjo ${pad(Math.floor(a/60))}:${pad(a%60)}. Po ${b} min ji baigėsi. Kokį laiką rodė laikrodis?`,[F('h',Math.floor((a+b)/60)),F('min',(a+b)%60)],'Kas 60 minučių pasikeičia valanda.','Prie pradžios laiko pridėk minutes, prireikus paversk jas valandomis.',`${time(a)} + ${b} min = ${time(a+b)}`)});
function clock(h,m){let line=(ang,len,w)=>`<line x1="100" y1="100" x2="${100+len*Math.sin(ang)}" y2="${100-len*Math.cos(ang)}" stroke="#173c55" stroke-width="${w}" stroke-linecap="round"/>`;return `<svg viewBox="0 0 200 200" role="img" aria-label="Analoginis laikrodis"><circle cx="100" cy="100" r="92" fill="#f3f9fc" stroke="#225f91" stroke-width="3"/>${Array.from({length:12},(_,i)=>{let n=i+1,a=n*Math.PI/6;return `<text x="${100+74*Math.sin(a)}" y="${105-74*Math.cos(a)}" text-anchor="middle" font-size="14">${n}</text>`}).join('')}${line((h%12+m/60)*Math.PI/6,43,6)}${line(m*Math.PI/30,65,3)}<circle cx="100" cy="100" r="4" fill="#173c55"/></svg>`}
add('clock',L,'C',()=>{let h=r(14,21),m=r(0,11)*5,d=r(7,19),a=h*60+m-d;return Q(`Šis laikrodis rodo popietės laiką ir skuba ${d} min. Koks tikslus laikas?`,[F('h (24 val. formatu)',Math.floor(a/60)),F('min',a%60)],'Skubantis laikrodis rodo vėlesnį laiką negu tikrasis.','Nuskaityk laikrodį ir atimk nurodytas minutes.',`Laikrodis rodo ${time(h*60+m)}.\nAtėmus ${d} min gauname ${time(a)}.`,clock(h,m))});

const app=typeof document!=='undefined'?document.getElementById('app'):null;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const levels={A:'Apšilimas',B:'Pagrindinis',C:'Iššūkis'};let storageOK=true;
function load(){try{let x=JSON.parse(localStorage.getItem('mokslo-v1')||'null');return x&&Array.isArray(x.math)&&Array.isArray(x.lt)?x:{math:[],lt:[]}}catch(e){storageOK=false;return {math:[],lt:[]}}}
let history=app?load():{math:[],lt:[]};function save(){try{localStorage.setItem('mokslo-v1',JSON.stringify(history))}catch(e){storageOK=false}}
let session=null,dict=null;let recordedPlayer=null, audioRun=0;function cancelSpeech(){audioRun++;if(recordedPlayer){recordedPlayer.pause();recordedPlayer=null}if(typeof speechSynthesis!=='undefined')speechSynthesis.cancel()}
function view(html){document.body.classList.toggle('no-motion',!prefs.motion);app.innerHTML=html+`<p class="footer">Mokslo nuotykiai · V2.5.1 · 4 klasė · ${storageOK?'Rezultatai saugomi šiame įrenginyje.':'Šioje naršyklėje rezultatų išsaugoti nepavyksta.'}</p>`;window.scrollTo(0,0)}
function btn(id,fn){document.getElementById(id)?.addEventListener('click',fn)}
function home(){setTab('home');cancelSpeech();session=null;dict=null;view(`<section class="panel"><p class="tag">TAVO MOKYMOSI ERDVĖ</p><h2>Ką šiandien mokysimės?</h2><p>Rinkis dalyką. Mokykis savo tempu ir išbandyk naujus iššūkius.</p>${hero()}${dailyCard()}<div class="tiles"><button class="tile" id="math"><strong>➗ Matematika</strong>Uždaviniai, skaičiavimai ir loginiai iššūkiai.</button><button class="tile" id="lt"><strong>✎ Lietuvių kalba</strong>Gramatika, diktantai ir rašybos pratybos.</button><button class="tile" id="stats"><strong>☆ Mano pažanga</strong>Peržiūrėk rezultatus ir pasikartok klaidas.</button><button class="tile" id="pet"><strong>🐉 Mano drakoniukas</strong>Augintinis ir pasiekimų kolekcija.</button><button class="tile" id="shop"><strong>🎁 Prizų parduotuvė</strong>Keisk žvaigždutes į tikrus prizus.</button></div></section>`);btn('math',mathMenu);btn('lt',ltMenu);btn('stats',stats);btn('pet',petPage);btn('shop',()=>shopPage());btn('dailyChallenge',challengePage)}
function mathMenu(){setTab('math');cancelSpeech();view(`<section class="panel"><p class="tag">MATEMATIKA</p><h2>Pasirink treniruotę</h2><div class="tiles"><button class="tile" id="daily"><strong>Dienos treniruotė</strong>${trainingLabel('math')}. Su pagalba.</button><button class="tile" id="test"><strong>Kontrolinis testas</strong>10 užduočių: 3 A, 5 B, 2 C. Atsakymai tik pabaigoje.</button><button class="tile" id="retry"><strong>Klaidų kartojimas</strong>Nauji uždaviniai iš sunkiau sekusių temų.</button></div><hr style="border:0;border-top:1px solid var(--line);margin:24px 0"><h3>Mokymasis pagal temą</h3><div class="actions"><select id="topic" aria-label="Tema">${[...new Set(T.map(t=>t.topic))].map(t=>`<option>${t}</option>`).join('')}</select><button id="theme">Pradėti treniruotę</button></div></section>`);btn('daily',()=>startMath('daily'));btn('test',()=>startMath('test'));btn('retry',()=>startMath('retry'));btn('theme',()=>startMath('topic',document.getElementById('topic').value))}
function chooseTasks(mode,topic){let missed=new Map();history.math.forEach(x=>{if(!x.independent)missed.set(x.id,(missed.get(x.id)||0)+1);else missed.set(x.id,Math.max(0,(missed.get(x.id)||0)-1))});let pool=mode==='topic'?T.filter(t=>t.topic===topic):mode==='retry'&&[...missed.values()].some(v=>v>0)?T.filter(t=>missed.get(t.id)>0):T;if(!pool.length)pool=T;let used=new Set(),seen=new Set(),out=[];for(const level of levelPlan('math',mode)){let p=nearestPool(pool,level),fresh=p.filter(t=>!used.has(t.id));let t=pick(fresh.length?fresh:p);used.add(t.id);let q=t.make();for(let i=0;i<25&&seen.has(q.question+q.diagram);i++)q=t.make();seen.add(q.question+q.diagram);out.push({...q,id:t.id,level:t.level,topic:t.topic})}return out}
function startMath(mode,topic){setTab('math');session={mode,qs:chooseTasks(mode,topic),i:0,records:[],hint:0,attempts:0,feedback:'',locked:false,values:[],finished:false};renderMath()}
function parseValue(s,type){s=s.trim().replace(',','.');if(type==='fraction'){let m=s.match(/^(\d+)\s*\/\s*(\d+)$/);return m&&Number(m[2])>0?Number(m[1])/Number(m[2]):NaN}return /^-?\d+(\.\d+)?$/.test(s)?Number(s):NaN}
function matches(s,f){return Math.abs(parseValue(s,f.type)-f.value)<1e-8}
function readFields(){session.values=[...app.querySelectorAll('[data-answer]')].map(x=>x.value)}
function renderMath(){let s=session,q=s.qs[s.i],test=s.mode==='test';view(`<section class="panel"><div class="top"><span class="tag">${test?'KONTROLINIS TESTAS':q.topic.toUpperCase()}</span><small>${s.i+1} / ${s.qs.length} · ${q.level} – ${levels[q.level]}</small></div><div class="progress" aria-label="Pažanga"><span style="width:${(s.i+1)/s.qs.length*100}%"></span></div><div class="question">${esc(q.question)}</div>${q.diagram?`<div class="diagram">${q.diagram}</div>`:''}<form id="answerForm"><div class="fields">${q.fields.map((f,i)=>`<div class="field"><label for="a${i}">${esc(f.label||'Atsakymas')}</label><input id="a${i}" data-answer type="text" inputmode="${f.type==='fraction'?'text':'decimal'}" autocomplete="off" spellcheck="false" value="${esc(s.values[i]||'')}" ${s.locked?'disabled':''}></div>`).join('')}</div><div class="actions" style="margin-top:20px">${s.locked?'<button type="button" id="next">Kita užduotis →</button>':`<button type="submit">${test?'Išsaugoti ir tęsti':'Patikrinti atsakymą'}</button>`}${!s.locked&&!test?'<button type="button" class="secondary" id="skip">Praleisti</button>':''}</div></form>${s.feedback?`<div role="status" class="note ${s.locked?'good':'warn'}">${esc(s.feedback)}</div>`:''}${!test?`${s.hint>=1?`<div class="note"><b>1. Kaip mąstyti?</b><br>${esc(q.hint)}</div>`:''}${s.hint>=2?`<div class="note"><b>2. Sprendimo planas</b><br>${esc(q.plan)}</div>`:''}${s.hint>=3?`<div class="note"><b>3. Visas sprendimas</b><br>${esc(q.solution)}</div>`:''}${!s.locked&&s.hint<3?`<button class="secondary" id="hint">${['💡 Padėk suprasti','Parodyk sprendimo planą','Parodyk visą sprendimą'][s.hint]}</button>`:''}`:''}</section>`);
 document.getElementById('answerForm').addEventListener('submit',e=>{e.preventDefault();readFields();if(s.values.some(x=>!x.trim())){s.feedback='Įrašyk atsakymą į kiekvieną laukelį.';renderMath();return}if(s.values.some((x,i)=>!Number.isFinite(parseValue(x,q.fields[i].type)))){s.feedback='Patikrink atsakymo formatą. Trupmeną rašyk, pavyzdžiui, 1/3.';renderMath();return}s.attempts++;let correct=q.fields.every((f,i)=>matches(s.values[i],f));if(test){record(correct);advance();return}if(correct){s.locked=true;s.feedback=praise(s.hint>0);record(true);celebrate()}else{s.feedback='Dar ne visai. Pabandyk dar kartą arba pasinaudok užuomina.'}renderMath()});btn('hint',()=>{readFields();s.hint++;renderMath()});btn('skip',()=>{readFields();record(false);advance()});btn('next',advance)}
function record(correct){let s=session,q=s.qs[s.i];s.records.push({id:q.id,topic:q.topic,level:q.level,correct,independent:correct&&s.hint===0&&s.attempts===1,hint:s.hint,attempts:s.attempts,values:[...s.values],question:q.question,solution:q.solution,date:new Date().toISOString()})}
function advance(){let s=session;s.i++;if(s.i>=s.qs.length){finishMath();return}s.hint=0;s.attempts=0;s.feedback='';s.locked=false;s.values=[];renderMath()}

function ltMenu(){setTab('lt');cancelSpeech();ls=null;view(`<section class="panel"><p class="tag">LIETUVIŲ KALBA</p><h2>Pasirink treniruotę</h2><p>Gramatika ir rašyba pagal 4 klasės pratybų temas.</p><div class="tiles"><button class="tile" id="ltDaily"><strong>Dienos treniruotė</strong>${trainingLabel('grammar')}.</button><button class="tile" id="ltTest"><strong>Kontrolinis testas</strong>10 užduočių: 3 A, 5 B, 2 C. Atsakymai pabaigoje.</button><button class="tile" id="ltGrammarRetry"><strong>Klaidų kartojimas</strong>Pasikartok sunkesnes temas.</button><button class="tile" id="openDict"><strong>Diktantai</strong>Klausyk sakinių ir rašyk.</button></div><h3 style="margin-top:24px">Mokymasis pagal temą</h3><div class="actions"><select id="ltTopic" aria-label="Tema">${[...new Set(ltBank.map(x=>x.topic))].map(x=>'<option>'+esc(x)+'</option>').join('')}</select><button id="ltTheme">Pradėti temą</button></div></section>`);btn('ltDaily',()=>startLT('daily'));btn('ltTest',()=>startLT('test'));btn('ltGrammarRetry',()=>startLT('retry'));btn('ltTheme',()=>startLT('topic',document.getElementById('ltTopic').value));btn('openDict',dictMenu)}

function ltNorm(s,q){let x=norm(s).replace(/\s*,\s*/g,', ').replace(/\s*([?!])$/,'$1');return /Perrašyk|Sutvarkyk/.test(q.q)||q.topic==='Didžiosios raidės'?x:x.toLocaleLowerCase('lt')}

const diffNames={easy:'Lengvas',normal:'Vidutinis',hard:'Sudėtingas',auto:'Automatinis'};
const mixes={easy:[.6,.3,.1],normal:[.3,.5,.2],hard:[.1,.3,.6]};

function levelPlan(subject,mode){let n=mode==='test'?10:prefs.count,m=mode==='test'?mixes.normal:mixes[resolvedDiff(subject)];let raw=m.map(x=>x*n),nums=raw.map(Math.floor),left=n-nums.reduce((a,b)=>a+b,0);let order=[0,1,2].sort((a,b)=>(raw[b]-nums[b])-(raw[a]-nums[a])||a-b);for(let i=0;i<left;i++)nums[order[i]]++;return nums.flatMap((v,i)=>Array(v).fill('ABC'[i]))}

function learningSettings(){const opt=(s)=>Object.entries(diffNames).map(([k,v])=>'<option value="'+k+'" '+(prefs[s]===k?'selected':'')+'>'+v+'</option>').join('');return '<div class="settings-fields"><label>Matematikos sudėtingumas<select id="mathDiff">'+opt('math')+'</select></label><label>Lietuvių kalbos sudėtingumas<select id="grammarDiff">'+opt('grammar')+'</select></label><label>Užduočių skaičius treniruotėje<select id="taskCount">'+[5,10,15,20].map(n=>'<option '+(prefs.count===n?'selected':'')+'>'+n+'</option>').join('')+'</select></label><p class="muted">Automatinis lygis vertina paskutinių iki 20 užduočių savarankiškus atsakymus. Kontroliniai testai išlieka 10 užduočių (3 A, 5 B, 2 C); diktantų ilgis pasirenkamas atskirai. Temų ir klaidų kartojimo režimu lygiai priklauso nuo galimų užduočių.</p><label class="checkline"><input id="motion" type="checkbox" '+(prefs.motion?'checked':'')+'> Džiaugsmo animacijos</label><label class="checkline"><input id="sound" type="checkbox" '+(prefs.sound?'checked':'')+'> Trumpas sėkmės garsas</label><p id="learningSaved" class="muted" role="status"></p></div>'}
function bindLearningSettings(){for(const [id,key,type] of [['mathDiff','math','text'],['grammarDiff','grammar','text'],['taskCount','count','number'],['motion','motion','bool'],['sound','sound','bool']]){const e=document.getElementById(id);e.onchange=()=>{prefs[key]=type==='bool'?e.checked:type==='number'?Number(e.value):e.value;savePrefs();document.getElementById('learningSaved').textContent='Nustatymai išsaugoti.'}}}
function dayKey(d=new Date()){let x=new Date(d);if(!Number.isFinite(x.getTime()))return '';return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
function logSession(subject,n,correct){(history.sessions??=[]).push({subject,n,correct,date:new Date().toISOString()})}
function earned(n,correct){return 5*n+5*correct+10}
function profile(){let m=history.math||[],g=history.grammar||[],d=history.lt||[],a=[...m,...g],ch=Object.values(history.challenges||{}),sessions=history.sessions||[];let xp=a.reduce((n,x)=>n+5+(x.correct?5:0),0)+d.reduce((n,x)=>n+5*(x.count||0)+5*(x.exact||0),0)+10*sessions.length+25*ch.filter(x=>x.correct).length;let dates=new Set([...a,...d,...ch].map(x=>dayKey(x.date)).filter(Boolean));let badges=[['🏅','Pirmieji žingsniai','Atlik 10 užduočių',a.length>=10],['🏆','Matematikos meistrė','100 matematikos užduočių',m.length>=100],['✍️','Rašybos ekspertė','Diktantas be klaidų',d.some(x=>x.count>0&&x.exact===x.count)],['🧠','Gudrioji galvelė','10 teisingų C lygio atsakymų',a.filter(x=>x.level==='C'&&x.correct).length>=10],['🎯','Taiklus atsakymas','10 teisingų iš eilės',bestRun(a)>=10],['💎','Atkaklioji','20 teisingų atsakymų po klaidos arba su pagalba',a.filter(x=>x.correct&&!x.independent).length>=20],['🌈','Mokslo keliautoja','Mokykis 7 skirtingas dienas',dates.size>=7],['👑','Mokslo čempionė','50 baigtų treniruočių nuo V2.4',sessions.length>=50],['🗝️','Lobių ieškotoja','5 išspręsti dienos iššūkiai',ch.filter(x=>x.correct).length>=5]];return {xp,level:1+Math.floor(xp/150),stars:a.filter(x=>x.correct).length+d.reduce((n,x)=>n+(x.exact||0),0),days:dates.size,badges,stage:xp>=600?3:xp>=150?2:1}}
function bestRun(a){let n=0,b=0;for(const x of [...a].sort((x,y)=>String(x.date).localeCompare(String(y.date)))){n=x.correct?n+1:0;b=Math.max(b,n)}return b}

function celebrate(){if(!prefs.sound||typeof window==='undefined')return;try{let AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;let a=new AC(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.setValueAtTime(523,a.currentTime);o.frequency.setValueAtTime(659,a.currentTime+.09);g.gain.setValueAtTime(.045,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.22);o.start();o.stop(a.currentTime+.24);o.onended=()=>a.close()}catch(e){}}

function dailyPuzzle(day=dayKey()){let n=Math.floor(Date.parse(day+'T00:00:00Z')/86400000);return puzzles[((n%puzzles.length)+puzzles.length)%puzzles.length]}

const initialPrizes=[{id:'twix',name:'TWIX šokoladukas',icon:'🍫',cost:100,active:true},{id:'two-euro',name:'2 € iš tėčio',icon:'💶',cost:100,active:true}];
let parentUnlocked=false,shopSelection=null;
function shopState(){return history.shop||{prizes:initialPrizes.map(x=>({...x})),claims:[],pin:null}}
function starBalance(){return Math.max(0,profile().stars-shopState().claims.filter(x=>x.status!=='cancelled').reduce((n,x)=>n+x.cost,0))}
function shopId(){return typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)}
function validCost(n){return Number.isSafeInteger(n)&&n>=1&&n<=100000}
function transactShop(change){let before=history.shop;try{let stored=localStorage.getItem('mokslo-v1');if(stored&&JSON.stringify(JSON.parse(stored))!==JSON.stringify(history))throw Error('Duomenys pasikeitė kitame lange. Atnaujink puslapį ir bandyk dar kartą.');let next=JSON.parse(JSON.stringify(shopState()));change(next);history.shop=next;localStorage.setItem('mokslo-v1',JSON.stringify(history));return {ok:true}}catch(e){if(before===undefined)delete history.shop;else history.shop=before;return {ok:false,error:e.message||'Nepavyko išsaugoti.'}}}
function claimPrize(id,expectedCost){return transactShop(s=>{let p=s.prizes.find(x=>x.id===id&&x.active);if(!p||p.cost!==expectedCost)throw Error('Prizo sąlygos pasikeitė. Pasirink iš naujo.');if(!s.pin)throw Error('Pirmiausia tėtis turi sukurti PIN kodą.');if(!validCost(p.cost)||starBalance()<p.cost)throw Error('Nepakanka žvaigždučių.');s.claims.push({id:shopId(),prizeId:p.id,name:p.name,icon:p.icon,cost:p.cost,status:'pending',date:new Date().toISOString()})})}
function resolveClaim(id,status){if(!parentUnlocked||!['delivered','cancelled'].includes(status))return {ok:false,error:'Reikia tėvų patvirtinimo.'};return transactShop(s=>{let x=s.claims.find(x=>x.id===id&&x.status==='pending');if(!x)throw Error('Šis prašymas jau sutvarkytas.');x.status=status;x.resolved=new Date().toISOString()})}
function prizeChange(id,name,cost,active){if(!parentUnlocked)return {ok:false,error:'Reikia tėvų PIN.'};name=String(name).trim();if(!name||name.length>80||!validCost(cost))return {ok:false,error:'Įrašyk prizo pavadinimą ir sveiką kainą nuo 1 iki 100 000.'};return transactShop(s=>{if(id){let p=s.prizes.find(x=>x.id===id);if(!p)throw Error('Prizas nerastas.');Object.assign(p,{name,cost,active})}else{s.prizes.push({id:shopId(),name,cost,active:true,icon:'🎁'})}})}
async function pinDigest(pin,salt){if(!globalThis.crypto?.subtle)throw Error('PIN apsaugai reikia saugaus HTTPS puslapio.');let b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+pin));return Array.from(new Uint8Array(b),x=>x.toString(16).padStart(2,'0')).join('')}
function validPin(pin){return /^[0-9]{4,8}$/.test(pin)}
function shopStatus(status){return {pending:'Laukia tėčio patvirtinimo',delivered:'Prizas atiduotas',cancelled:'Atšaukta · žvaigždutės grąžintos'}[status]||'Nežinoma'}
function displayDate(x){let d=new Date(x);return Number.isNaN(d.getTime())?'':d.toLocaleDateString('lt-LT')}
function shopPage(message=''){if(typeof message!=='string')message='';setTab('shop');cancelSpeech();const s=shopState(),balance=starBalance();let available=s.prizes.filter(p=>p.active);let selected=shopSelection&&available.find(p=>p.id===shopSelection.id&&p.cost===shopSelection.cost);view('<section class="panel"><p class="tag">TAVO APDOVANOJIMAI</p><h2>🎁 Prizų parduotuvė</h2><p>Žvaigždutes uždirbi mokydamasi. Gali jas iškeisti į prizus, o tavo XP ir drakoniuko lygis nesumažės.</p><div class="shop-wallet"><strong>⭐ '+balance+'</strong>Žvaigždutės prizams · iš viso uždirbta '+profile().stars+'</div>'+(message?'<p class="note" role="status">'+esc(message)+'</p>':'')+'<div class="prize-grid">'+available.map(p=>'<article class="prize-card"><div class="prize-icon">'+esc(p.icon)+'</div><h3>'+esc(p.name)+'</h3><p>⭐ '+p.cost+' žvaigždučių</p><div class="xp-track"><span style="width:'+Math.min(100,balance/p.cost*100)+'%"></span></div><p class="muted">'+(balance>=p.cost?'Pakanka žvaigždučių!':'Trūksta '+(p.cost-balance)+' žvaigždučių')+'</p><button id="claim-'+esc(p.id)+'" '+(balance<p.cost?'disabled':'')+'>Pasirinkti prizą</button></article>').join('')+'</div>'+(available.length?'':'<p>Šiuo metu prizų nėra.</p>')+(selected?'<div class="prize-confirm"><h3>Pasirinkai: '+esc(selected.name)+'</h3><p>Bus nuskaičiuota '+selected.cost+' ⭐. Prizą atiduos tėtis.</p><div class="actions"><button id="claimConfirm" '+(!s.pin?'disabled':'')+'>Patvirtinti pasirinkimą</button><button class="secondary" id="claimBack">Grįžti</button></div>'+(!s.pin?'<p class="muted">Paprašyk tėčio pirmiausia sukurti PIN kodą žemiau.</p>':'')+'</div>':'')+'<h3>Mano prizų istorija</h3>'+(s.claims.length?[...s.claims].reverse().map(x=>'<div class="prize-log"><b>'+esc(x.icon)+' '+esc(x.name)+'</b><p>'+x.cost+' ⭐ · '+esc(shopStatus(x.status))+'</p><small>'+esc(displayDate(x.date))+'</small></div>').join(''):'<p class="muted">Dar nėra pasirinktų prizų.</p>')+'<div class="parent-area" id="parentArea"><h3>🔐 Tėvų skiltis</h3>'+parentHTML(s)+'</div></section>');for(const p of available)btn('claim-'+p.id,()=>{shopSelection={id:p.id,cost:p.cost};shopPage();document.getElementById('claimConfirm')?.scrollIntoView({block:'center'})});btn('claimBack',()=>{shopSelection=null;shopPage()});btn('claimConfirm',()=>{if(!selected)return;let r=claimPrize(selected.id,selected.cost);shopSelection=null;shopPage(r.ok?'Prizas rezervuotas! Parodyk tėčiui savo prizų istoriją.':r.error)});bindParent(s)}
function parentHTML(s){if(!parentUnlocked)return '<p class="muted">'+(s.pin?'Prizus tvarkyti gali tėtis, įvedęs PIN kodą.':'Pirmą kartą tėtis turi pats sukurti savo 4–8 skaitmenų PIN kodą.')+'</p><form id="parentLogin" class="parent-form"><label>'+(s.pin?'Tėvų PIN':'Sukurti tėvų PIN')+'<input id="parentPin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" required></label>'+(!s.pin?'<label>Pakartoti PIN<input id="parentPinAgain" type="password" inputmode="numeric" autocomplete="off" maxlength="8" required></label>':'')+'<div><button type="submit">'+(s.pin?'Atrakinti':'Sukurti PIN')+'</button></div></form><p class="muted status" id="parentStatus" role="status"></p><small>Vietinė apsauga šiame įrenginyje, ne tikra paskyra. PIN ir istorija nesinchronizuojami.</small>';let pending=s.claims.filter(x=>x.status==='pending');return '<div class="actions"><button id="parentLock" class="secondary">Užrakinti tėvų skiltį</button></div><h3>Laukiantys prizai ('+pending.length+')</h3>'+(pending.length?pending.map(x=>'<div class="prize-log"><b>'+esc(x.name)+' · '+x.cost+' ⭐</b><p>'+esc(displayDate(x.date))+'</p><div class="actions"><button id="deliver-'+esc(x.id)+'">Prizas atiduotas</button><button id="cancel-'+esc(x.id)+'" class="secondary">Atšaukti ir grąžinti ⭐</button></div></div>').join(''):'<p class="muted">Nėra laukiančių prizų.</p>')+'<h3>Prizų sąrašas</h3>'+s.prizes.map(p=>'<form class="prize-edit" id="edit-'+esc(p.id)+'"><label>Pavadinimas<input name="name" value="'+esc(p.name)+'" maxlength="80" required></label><label>Kaina žvaigždutėmis<input name="cost" type="number" min="1" max="100000" value="'+p.cost+'" required></label><label class="toggle-label"><input name="active" type="checkbox" '+(p.active?'checked':'')+'> Rodyti parduotuvėje</label><div><button class="secondary" type="submit">Išsaugoti</button></div></form>').join('')+'<h3>Pridėti naują prizą</h3><form class="parent-form" id="addPrize"><label>Pavadinimas<input name="name" maxlength="80" placeholder="Pvz., filmų vakaras" required></label><label>Kaina žvaigždutėmis<input name="cost" type="number" min="1" max="100000" value="100" required></label><div><button type="submit">Pridėti prizą</button></div></form><p id="parentStatus" class="muted status" role="status"></p><small>Atšaukus laukiantį prizą, žvaigždutės grąžinamos. Jau atiduoti prizai lieka istorijoje.</small>'}
function bindParent(s){const status=t=>{let e=document.getElementById('parentStatus');if(e)e.textContent=t};if(!parentUnlocked){const f=document.getElementById('parentLogin');f.onsubmit=async e=>{e.preventDefault();let pin=document.getElementById('parentPin').value,again=document.getElementById('parentPinAgain')?.value;if(!validPin(pin)){status('PIN turi būti iš 4–8 skaitmenų.');return}if(!s.pin&&pin!==again){status('PIN kodai nesutampa.');return}const b=f.querySelector('button');b.disabled=true;try{if(s.pin){if(await pinDigest(pin,s.pin.salt)!==s.pin.hash){status('Neteisingas PIN.');return}}else{let salt=shopId(),hash=await pinDigest(pin,salt);let r=transactShop(x=>{if(x.pin)throw Error('PIN jau sukurtas.');x.pin={salt,hash}});if(!r.ok){status(r.error);return}}if(currentTab==='shop'&&!settingsOpen&&f.isConnected){parentUnlocked=true;shopPage('Tėvų skiltis atrakinta.');document.getElementById('parentArea')?.scrollIntoView({block:'start'})}}catch(e){status(e.message)}finally{b.disabled=false}};return}btn('parentLock',()=>{parentUnlocked=false;shopPage('Tėvų skiltis užrakinta.')});for(let x of s.claims.filter(x=>x.status==='pending')){for(const [prefix,state] of [['deliver','delivered'],['cancel','cancelled']])btn(prefix+'-'+x.id,()=>{let r=resolveClaim(x.id,state);shopPage(r.ok?(state==='delivered'?'Prizas pažymėtas atiduotu.':'Prizas atšauktas, žvaigždutės grąžintos.'):r.error)})}for(const p of s.prizes){let f=document.getElementById('edit-'+p.id);f.onsubmit=e=>{e.preventDefault();let r=prizeChange(p.id,f.elements.name.value,Number(f.elements.cost.value),f.elements.active.checked);if(r.ok)shopPage('Prizas atnaujintas.');else status(r.error)}}let f=document.getElementById('addPrize');f.onsubmit=e=>{e.preventDefault();let r=prizeChange(null,f.elements.name.value,Number(f.elements.cost.value),true);if(r.ok)shopPage('Naujas prizas pridėtas.');else status(r.error)}}

let currentTab='home',settingsOpen=false,dictRate=.8;
try{if(typeof localStorage!=='undefined'){const v=Number(localStorage.getItem('mokslo-dict-rate'));if([.65,.8,1].includes(v))dictRate=v}}catch(e){}
function markNav(t){if(typeof document==='undefined')return;document.querySelectorAll('[data-nav]').forEach(x=>{if(x.dataset.nav===t)x.setAttribute('aria-current','page');else x.removeAttribute('aria-current')})}
function setTab(t){if(t!=='shop')parentUnlocked=false;currentTab=t;settingsOpen=false;if(app){app.hidden=false;const v=document.getElementById('voicePage');if(v)v.hidden=true;markNav(t)}}
function closeVoiceSettings(){cancelSpeech();setTab(currentTab)}
function dictMenu(){setTab('dict');cancelSpeech();view(`<section class="panel"><p class="tag">DIKTANTAI</p><h2>Ką šiandien rašysime?</h2><p>Pasirink diktantą, klausyk ir rašyk savo tempu.</p><div class="tiles"><button class="tile" id="sentences"><strong>Sakinių diktantas</strong>5 rišlūs sakiniai.</button><button class="tile" id="longDict"><strong>Ilgesnis diktantas</strong>10 sakinių iš dviejų tekstų.</button><button class="tile" id="word"><strong>Žodžių diktantas</strong>10 rašybos žodžių.</button><button class="tile" id="ltretry"><strong>Kartojimo diktantas</strong>Sakiniai su ankstesniais sunkiais žodžiais.</button></div>${dict&&!dict.finished?'<div class="actions" style="margin-top:20px"><button id="resumeDict" class="secondary">Tęsti pradėtą diktantą →</button></div>':''}</section>`);btn('sentences',()=>startDict('text'));btn('longDict',()=>startDict('long'));btn('word',()=>startDict('word'));btn('ltretry',()=>startDict('retry'));btn('resumeDict',renderDict)}
function voiceSettings(){if(settingsOpen)return;parentUnlocked=false;cancelSpeech();settingsOpen=true;app.hidden=true;const p=document.getElementById('voicePage');p.hidden=false;markNav('voice');p.innerHTML=`<section class="panel"><p class="tag">NUSTATYMAI</p><h2>Mokymosi nustatymai</h2><p>Pasirinkimai išsaugomi šiame įrenginyje. Nustatymai taikomi naujoms treniruotėms.</p>${learningSettings()}<h3 style="margin-top:24px">Balso nustatymai</h3><div class="settings-fields">${voicePicker()}<label>Diktavimo greitis<select id="settingsRate"><option value="0.65">Lėtai</option><option value="0.8">Ramiai</option><option value="1">Įprastai</option></select></label></div><h3>Balso išbandymas</h3><p class="muted">Labas! Šiandien mokysimės lietuvių kalbos. Kęstutis grįžo namo ir įminė mįslę.</p><div class="settings-actions"><button id="voiceTest">▶ Išbandyti balsą</button><button class="secondary" id="voiceStop">■ Sustabdyti</button></div><p id="voiceSettingsStatus" class="muted" role="status"></p><div class="settings-footer"><button id="settingsBack" class="secondary">← Grįžti į mokymąsi</button></div><p class="muted" style="margin-top:16px">Sintetiniai balsai: <a href="https://huggingface.co/RobertasTa/lt_LT-ingute-medium" target="_blank" rel="noopener">Ingutė</a> (Robertas &amp; Claude, NewGenLTU OpenRAIL-D 1.0) ir <a href="https://huggingface.co/RobertasTa/lt_LT-reginute1-medium" target="_blank" rel="noopener">Reginutė</a> (RobertasTa, LIEPA, CC BY 4.0).</p></section>`;bindLearningSettings();bindVoicePicker();const r=document.getElementById('settingsRate');r.value=String(dictRate);r.onchange=()=>{cancelSpeech();dictRate=Number(r.value);if(dict)dict.rate=dictRate;try{localStorage.setItem('mokslo-dict-rate',String(dictRate))}catch(e){}document.getElementById('voiceSettingsStatus').textContent='Greitis išsaugotas.'};btn('voiceTest',()=>speak(recordedItems[0],dictRate));btn('voiceStop',()=>{cancelSpeech();document.getElementById('voiceSettingsStatus').textContent='Sustabdyta.'});btn('settingsBack',closeVoiceSettings);window.scrollTo(0,0)}
function navigate(t,fn){if(settingsOpen&&t===currentTab){closeVoiceSettings();return}if(!settingsOpen&&currentTab==='dict'&&dict&&!dict.finished&&document.getElementById('written'))storeDict();if(settingsOpen&&currentTab==='dict'&&dict&&!dict.finished&&document.getElementById('written'))storeDict();cancelSpeech();fn()}

if(app){btn('home',()=>navigate('home',home));btn('navMath',()=>navigate('math',mathMenu));btn('navLt',()=>navigate('lt',ltMenu));btn('navDict',()=>navigate('dict',dictMenu));btn('navShop',()=>navigate('shop',shopPage));btn('navVoice',voiceSettings);home()}
if(typeof module!=='undefined')module.exports={T,chooseTasks,parseValue,matches,align};
</script></body></html>
