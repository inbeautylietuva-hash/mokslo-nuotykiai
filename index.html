function chooseTasks(mode,topic){let missed=new Map();history.math.forEach(x=>{if(!x.independent)missed.set(x.id,(missed.get(x.id)||0)+1);else missed.set(x.id,Math.max(0,(missed.get(x.id)||0)-1))});let pool=mode==='topic'?T.filter(t=>t.topic===topic):mode==='retry'&&[...missed.values()].some(v=>v>0)?T.filter(t=>missed.get(t.id)>0):T;if(!pool.length)pool=T;let used=new Set(),seen=new Set(),out=[];for(const level of levelPlan('math',mode)){let p=nearestPool(pool,level),fresh=p.filter(t=>!used.has(t.id));let t=pick(fresh.length?fresh:p);used.add(t.id);let q=t.make();for(let i=0;i<25&&seen.has(q.question+q.diagram);i++)q=t.make();seen.add(q.question+q.diagram);out.push({...q,id:t.id,level:t.level,topic:t.topic})}return out}

function getVoice(){if(typeof speechSynthesis==='undefined')return null;const vs=speechSynthesis.getVoices().filter(v=>/^lt(?:-|_|$)/i.test(v.lang));return vs.find(v=>/neural|natural|online/i.test(v.name))||vs[0]||null}
const dictVoiceOptions=[['ingute','Ingutė'],['reginute','Reginutė']];
let dictVoice='ingute';try{if(typeof localStorage!=='undefined'&&dictVoiceOptions.some(x=>x[0]===localStorage.getItem('mokslo-dict-voice')))dictVoice=localStorage.getItem('mokslo-dict-voice')}catch(e){}
function dictVoiceName(k){return dictVoiceOptions.find(x=>x[0]===k)?.[1].split(' (')[0]||k}
function specificDictVoice(k,voices){return (voices||[]).find(v=>/^lt(?:-|_|$)/i.test(v.lang)&& (k==='ona'?/\bona\b/i.test(v.name+' '+v.voiceURI):k==='achernar'?/achernar/i.test(v.name+' '+v.voiceURI):k==='krapas'?/krapas/i.test(v.name+' '+v.voiceURI)&&/regina/i.test(v.name+' '+v.voiceURI):false))||null}
function dictVoiceHint(k){return k==='reginute'?'Reginutės įrašai. Naujesniems nuotykiams, kuriems Reginutės įrašo dar nėra, naudojama Ingutė.':'Ingutės diktantų įrašai.'}

function voicePicker(){return '<label>Diktavimo balsas <select id="dictVoice">'+dictVoiceOptions.map(([k,n])=>'<option value="'+k+'" '+(dictVoice===k?'selected':'')+'>'+esc(n)+'</option>').join('')+'</select></label><p id="dictVoiceHint" class="muted">'+esc(dictVoiceHint(dictVoice))+'</p>'}

function startDict(mode){setTab('dict');cancelSpeech();let t=pick(texts),items=[...t.sentences];let missed=[...new Set(history.lt.flatMap(x=>x.missed||[]))];if(mode==='long'){let t2=pick(texts.filter(x=>x!==t));items.push(...t2.sentences);t={title:t.title+' / '+t2.title}}if(mode==='word'){items=shuffle([...new Set(words)]).slice(0,10);t={title:'Įsimintina rašyba'}}if(mode==='retry'){let all=texts.flatMap(x=>x.sentences),rank=shuffle(all).sort((a,b)=>tokens(b).filter(x=>missed.includes(x)).length-tokens(a).filter(x=>missed.includes(x)).length);items=rank.slice(0,6);t={title:'Rašybos kartojimas sakiniais'}}dict={title:t.title,items,i:0,answers:items.map(()=>''),mode:mode==='word'?'word':'text',rate:dictRate,finished:false};renderDict()}

function dayKey(d=new Date()){let x=new Date(d);if(!Number.isFinite(x.getTime()))return '';return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}

const initialPrizes=[{id:'twix',name:'TWIX šokoladukas',icon:'🍫',cost:100,active:true},{id:'two-euro',name:'2 € iš tėčio',icon:'💶',cost:100,active:true}];
let parentUnlocked=false,shopSelection=null;
function shopState(){return history.shop||{prizes:initialPrizes.map(x=>({...x})),claims:[],pin:null}}
function starBalance(){return Math.max(0,profile().stars-shopState().claims.filter(x=>x.status!=='cancelled').reduce((n,x)=>n+x.cost,0))}
function shopId(){return typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)}
function validCost(n){return Number.isSafeInteger(n)&&n>=1&&n<=100000}
function transactShop(change){if(cloudSession&&cloudMeta?.uid===cloudSession.user?.id&&(cloudConflict||cloudRemotePending))return {ok:false,error:'Pirmiausia sinchronizuok pažangą nustatymuose.'};let before=history.shop;try{let stored=localStorage.getItem('mokslo-v1');if(stored&&JSON.stringify(JSON.parse(stored))!==JSON.stringify(history))throw Error('Duomenys pasikeitė kitame lange. Atnaujink puslapį ir bandyk dar kartą.');let next=JSON.parse(JSON.stringify(shopState()));change(next);history.shop=next;localStorage.setItem('mokslo-v1',JSON.stringify(history));scheduleCloudSync();return {ok:true}}catch(e){if(before===undefined)delete history.shop;else history.shop=before;return {ok:false,error:e.message||'Nepavyko išsaugoti.'}}}
function claimPrize(id,expectedCost){return transactShop(s=>{let p=s.prizes.find(x=>x.id===id&&x.active);if(!p||p.cost!==expectedCost)throw Error('Prizo sąlygos pasikeitė. Pasirink iš naujo.');if(!s.pin)throw Error('Pirmiausia tėtis turi sukurti PIN kodą.');if(!validCost(p.cost)||starBalance()<p.cost)throw Error('Nepakanka žvaigždučių.');s.claims.push({id:shopId(),prizeId:p.id,name:p.name,icon:p.icon,cost:p.cost,status:'pending',date:new Date().toISOString()})})}
function resolveClaim(id,status){if(!parentUnlocked||!['delivered','cancelled'].includes(status))return {ok:false,error:'Reikia tėvų patvirtinimo.'};return transactShop(s=>{let x=s.claims.find(x=>x.id===id&&x.status==='pending');if(!x)throw Error('Šis prašymas jau sutvarkytas.');x.status=status;x.resolved=new Date().toISOString()})}
function prizeChange(id,name,cost,active){if(!parentUnlocked)return {ok:false,error:'Reikia tėvų PIN.'};name=String(name).trim();if(!name||name.length>80||!validCost(cost))return {ok:false,error:'Įrašyk prizo pavadinimą ir sveiką kainą nuo 1 iki 100 000.'};return transactShop(s=>{if(id){let p=s.prizes.find(x=>x.id===id);if(!p)throw Error('Prizas nerastas.');Object.assign(p,{name,cost,active})}else{s.prizes.push({id:shopId(),name,cost,active:true,icon:'🎁'})}})}
async function pinDigest(pin,salt){if(!globalThis.crypto?.subtle)throw Error('PIN apsaugai reikia saugaus HTTPS puslapio.');let b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+pin));return Array.from(new Uint8Array(b),x=>x.toString(16).padStart(2,'0')).join('')}
function validPin(pin){return /^[0-9]{4,8}$/.test(pin)}
function shopStatus(status){return {pending:'Laukia tėčio patvirtinimo',delivered:'Prizas atiduotas',cancelled:'Atšaukta · žvaigždutės grąžintos'}[status]||'Nežinoma'}
function displayDate(x){let d=new Date(x);return Number.isNaN(d.getTime())?'':d.toLocaleDateString('lt-LT')}
function shopPage(message=''){if(typeof message!=='string')message='';setTab('shop');cancelSpeech();const s=shopState(),balance=starBalance();let available=s.prizes.filter(p=>p.active);let selected=shopSelection&&available.find(p=>p.id===shopSelection.id&&p.cost===shopSelection.cost);view('<section class="panel"><p class="tag">TAVO APDOVANOJIMAI</p><h2>🎁 Prizų parduotuvė</h2><p>Žvaigždutes uždirbi mokydamasi. Gali jas iškeisti į prizus, o tavo XP ir drakoniuko lygis nesumažės.</p><div class="shop-wallet"><strong>⭐ '+balance+'</strong>Žvaigždutės prizams · iš viso uždirbta '+profile().stars+'</div>'+(message?'<p class="note" role="status">'+esc(message)+'</p>':'')+'<div class="prize-grid">'+available.map(p=>'<article class="prize-card"><div class="prize-icon">'+esc(p.icon)+'</div><h3>'+esc(p.name)+'</h3><p>⭐ '+p.cost+' žvaigždučių</p><div class="xp-track"><span style="width:'+Math.min(100,balance/p.cost*100)+'%"></span></div><p class="muted">'+(balance>=p.cost?'Pakanka žvaigždučių!':'Trūksta '+(p.cost-balance)+' žvaigždučių')+'</p><button id="claim-'+esc(p.id)+'" '+(balance<p.cost?'disabled':'')+'>Pasirinkti prizą</button></article>').join('')+'</div>'+(available.length?'':'<p>Šiuo metu prizų nėra.</p>')+(selected?'<div class="prize-confirm"><h3>Pasirinkai: '+esc(selected.name)+'</h3><p>Bus nuskaičiuota '+selected.cost+' ⭐. Prizą atiduos tėtis.</p><div class="actions"><button id="claimConfirm" '+(!s.pin?'disabled':'')+'>Patvirtinti pasirinkimą</button><button class="secondary" id="claimBack">Grįžti</button></div>'+(!s.pin?'<p class="muted">Paprašyk tėčio pirmiausia sukurti PIN kodą žemiau.</p>':'')+'</div>':'')+'<h3>Mano prizų istorija</h3>'+(s.claims.length?[...s.claims].reverse().map(x=>'<div class="prize-log"><b>'+esc(x.icon)+' '+esc(x.name)+'</b><p>'+x.cost+' ⭐ · '+esc(shopStatus(x.status))+'</p><small>'+esc(displayDate(x.date))+'</small></div>').join(''):'<p class="muted">Dar nėra pasirinktų prizų.</p>')+'<div class="parent-area" id="parentArea"><h3>🔐 Tėvų skilt function parentHTML(s){if(!parentUnlocked)return '<p class="muted">'+(s.pin?'Prizus tvarkyti gali tėtis, įvedęs PIN kodą.':'Pirmą kartą tėtis turi pats sukurti savo 4–8 skaitmenų PIN kodą.')+'</p><form id="parentLogin" class="parent-form"><label>'+(s.pin?'Tėvų PIN':'Sukurti tėvų PIN')+'<input id="parentPin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" required></label>'+(!s.pin?'<label>Pakartoti PIN<input id="parentPinAgain" type="password" inputmode="numeric" autocomplete="off" maxlength="8" required></label>':'')+'<div><button type="submit">'+(s.pin?'Atrakinti':'Sukurti PIN')+'</button></div></form><p class="muted status" id="parentStatus" role="status"></p><small>Vietinė apsauga šiame įrenginyje, ne tikra paskyra. PIN ir istorija nesinchronizuojami.</small>';let pending=s.claims.filter(x=>x.status==='pending');return '<div class="actions"><button id="parentLock" class="secondary">Užrakinti tėvų skiltį</button></div><h3>Laukiantys prizai ('+pending.length+')</h3>'+(pending.length?pending.map(x=>'<div class="prize-log"><b>'+esc(x.name)+' · '+x.cost+' ⭐</b><p>'+esc(displayDate(x.date))+'</p><div class="actions"><button id="deliver-'+esc(x.id)+'">Prizas atiduotas</button><button id="cancel-'+esc(x.id)+'" class="secondary">Atšaukti ir grąžinti ⭐</button></div></div>').join(''):'<p class="muted">Nėra laukiančių prizų.</p>')+'<h3>Prizų sąrašas</h3>'+s.prizes.map(p=>'<form class="prize-edit" id="edit-'+esc(p.id)+'"><label>Pavadinimas<input name="name" value="'+esc(p.name)+'" maxlength="80" required></label><label>Kaina žvaigždutėmis<input name="cost" type="number" min="1" max="100000" value="'+p.cost+'" required></label><label class="toggle-label"><input name="active" type="checkbox" '+(p.active?'checked':'')+'> Rodyti parduotuvėje</label><div><button class="secondary" type="submit">Išsaugoti</button></div></form>').join('')+'<h3>Pridėti naują prizą</h3><form class="parent-form" id="addPrize"><label>Pavadinimas<input name="name" maxlength="80" placeholder="Pvz., filmų vakaras" required></label><label>Kaina žvaigždutėmis<input name="cost" type="number" min="1" max="100000" value="100" required></label><div><button type="submit">Pridėti prizą</button></div></form><p id="parentStatus" class="muted status" role="status"></p><small>Atšaukus laukiantį prizą, žvaigždutės grąžinamos. Jau atiduoti prizai lieka istorijoje.</small>'}
function bindParent(s){const status=t=>{let e=document.getElementById('parentStatus');if(e)e.textContent=t};if(!parentUnlocked){const f=document.getElementById('parentLogin');f.onsubmit=async e=>{e.preventDefault();let pin=document.getElementById('parentPin').value,again=document.getElementById('parentPinAgain')?.value;if(!validPin(pin)){status('PIN turi būti iš 4–8 skaitmenų.');return}if(!s.pin&&pin!==again){status('PIN kodai nesutampa.');return}const b=f.querySelector('button');b.disabled=true;try{if(s.pin){if(await pinDigest(pin,s.pin.salt)!==s.pin.hash){status('Neteisingas PIN.');return}}else{let salt=shopId(),hash=await pinDigest(pin,salt);let r=transactShop(x=>{if(x.pin)throw Error('PIN jau sukurtas.');x.pin={salt,hash}});if(!r.ok){status(r.error);return}}if(currentTab==='shop'&&!settingsOpen&&f.isConnected){parentUnlocked=true;shopPage('Tėvų skiltis atrakinta.');document.getElementById('parentArea')?.scrollIntoView({block:'start'})}}catch(e){status(e.message)}finally{b.disabled=false}};return}btn('parentLock',()=>{parentUnlocked=false;shopPage('Tėvų skiltis užrakinta.')});for(let x of s.claims.filter(x=>x.status==='pending')){for(const [prefix,state] of [['deliver','delivered'],['cancel','cancelled']])btn(prefix+'-'+x.id,()=>{let r=resolveClaim(x.id,state);shopPage(r.ok?(state==='delivered'?'Prizas pažymėtas atiduotu.':'Prizas atšauktas, žvaigždutės grąžintos.'):r.error)})}for(const p of s.prizes){let f=document.getElementById('edit-'+p.id);f.onsubmit=e=>{e.preventDefault();let r=prizeChange(p.id,f.elements.name.value,Number(f.elements.cost.value),f.elements.active.checked);if(r.ok)shopPage('Prizas atnaujintas.');else status(r.error)}}let f=document.getElementById('addPrize');f.onsubmit=e=>{e.preventDefault();let r=prizeChange(null,f.elements.name.value,Number(f.elements.cost.value),true);if(r.ok)shopPage('Naujas prizas pridėtas.');else status(r.error)}}

function advLevels(subject,n){let m=resolvedDiff(subject),p=m==='easy'?[.6,.3,.1]:m==='hard'?[.1,.3,.6]:[.3,.5,.2],raw=p.map(x=>x*n),a=raw.map(Math.floor),left=n-a.reduce((x,y)=>x+y,0),order=[0,1,2].sort((i,j)=>(raw[j]-a[j])-(raw[i]-a[i])||i-j);for(let i=0;i<left;i++)a[order[i]]++;return a.flatMap((v,i)=>Array(v).fill('ABC'[i]))}

function miniMoney(n){return (n/100).toFixed(2).replace('.',',')+' €'}
const miniFoods=[['🍎','Obuolys'],['🧁','Keksiukas'],['🍓','Braškės']];
function miniQuestion(kind,level){if(kind==='pizza'){let den=pick(level==='A'?[2,4,6]:level==='C'?[8,10,12]:[4,6,8]);return {den,num:1+Math.floor(Math.random()*(den-1)),level}}let prices=(level==='A'?[50,100,150]:level==='C'?[85,135,240]:[120,250,180]).map(n=>n+(level==='A'?0:Math.floor(Math.random()*4)*10)),solution=[1+Math.floor(Math.random()*2),Math.floor(Math.random()*3),1+Math.floor(Math.random()*2)];return {prices,solution,target:solution.reduce((n,x,i)=>n+x*prices[i],0),level}}
function miniStart(kind){miniGame={id:shopId(),kind,qs:advLevels('math',5).map(l=>miniQuestion(kind,l)),i:0,records:[],selected:[],counts:[0,0,0],attempts:0,hint:false,locked:false,finished:false,feedback:''};miniRender()}
function miniTotal(q,g){return g.counts.reduce((n,x,i)=>n+x*q.prices[i],0)}
function miniPizza(q,g){return '<svg class="mini-pizza" viewBox="0 0 260 260" role="group" aria-label="Pica padalyta į '+q.den+' dalis"><circle cx="130" cy="130" r="122" fill="#b77d41"/>'+Array.from({length:q.den},(_,i)=>{let a=(i*360/q.den-90)*Math.PI/180,b=((i+1)*360/q.den-90)*Math.PI/180,m=(a+b)/2,sel=g.selected.includes(i);return '<g class="pizza-piece" data-piece="'+i+'" role="button" tabindex="'+(g.locked?-1:0)+'" aria-label="Picos dalis '+(i+1)+'" aria-pressed="'+sel+'"><path d="M130 130L'+(130+114*Math.cos(a))+' '+(130+114*Math.sin(a))+'A114 114 0 0 1 '+(130+114*Math.cos(b))+' '+(130+114*Math.sin(b))+'Z" fill="#ffda83" stroke="#b77d41" stroke-width="3"/><circle cx="'+(130+72*Math.cos(m))+'" cy="'+(130+72*Math.sin(m))+'" r="12" fill="#c86a50"/><text x="'+(130+72*Math.cos(m))+'" y="'+(134+72*Math.sin(m))+'" font-size="12" fill="#fff" text-anchor="middle" pointer-events="none">'+(i+1)+'</text></g>'}).join('')+'</svg><div class="mini-count">Pažymėta: '+g.selected.length+' / '+q.den+'</div><div class="piece-buttons">'+Array.from({length:q.den},(_,i)=>'<button id="piece-'+i+'" class="secondary" aria-pressed="'+g.selected.includes(i)+'" '+(g.locked?'disabled':'')+'>'+(i+1)+'</button>').join('')+'</div>'}
function miniMarket(q,g){return '<div class="food-grid">'+miniFoods.map(([emoji,name],i)=>'<div class="food-card"><span class="food">'+emoji+'</span><strong>'+name+'</strong><span>'+miniMoney(q.prices[i])+'</span><div class="food-controls"><button class="secondary" id="minus-'+i+'" aria-label="Pašalinti '+name+'" '+(g.locked||!g.counts[i]?'disabled':'')+'>−</button><b>'+g.counts[i]+'</b><button id="plus-'+i+'" aria-label="Pridėti '+name+'" '+(g.locked||g.counts[i]>=12?'disabled':'')+'>+</button></div></div>').join('')+'</div><div class="mini-total"><span>Krepšelio suma</span><span>'+miniMoney(miniTotal(q,g))+'</span></div><div class="mini-total"><span>Tikslas</span><span>'+miniMoney(q.target)+'</span></div>'}
function miniCorrect(q,g){return g.kind==='pizza'?g.selected.length===q.num:miniTotal(q,g)===q.target}
function miniCommit(ok){let g=miniGame,q=g.qs[g.i];if(g.locked)return;g.records.push({subject:'math',id:g.kind==='pizza'?'fraction':'moneyadd',topic:g.kind==='pizza'?'Trupmenos':'Pinigai',level:q.level,correct:ok,independent:ok&&!g.hint&&g.attempts===1,hint:g.hint?1:0,attempts:g.attempts,date:new Date().toISOString()});g.locked=true;g.feedback=ok?'✨ Puiku! Užduotis įveikta.':'Sprendimas parodytas. Šį kartą žvaigždutė neskiriama.';if(ok)celebrate()}

function miniRender(){let g=miniGame;if(g?.v3key){v3Render();return}setTab('adventure');cancelSpeech();if(g.finished){view('<section class="panel"><p class="tag">ŽAIDIMAS BAIGTAS</p><h2>🎉 Puikiai padirbėta!</h2><div class="adv-result"><div class="adv-reward">+'+g.rewardXP+' XP · +'+g.rewardStars+' ⭐</div><p>Taškai įskaityti į bendrą pažangą.</p></div><div class="actions"><button id="miniAgain">Kitas žaidimas</button><button class="secondary" id="miniPrizes">🎁 Prizai</button></div></section>');btn('miniAgain',()=>{miniGame=null;adventureMenu()});btn('miniPrizes',()=>shopPage());return}let q=g.qs[g.i],pizza=g.kind==='pizza';view('<section class="panel"><div class="top"><span class="tag">'+(pizza?'PICŲ VIRTUVĖ':'DRAKONŲ TURGUS')+'</span><small>'+(g.i+1)+' / 5 · '+q.level+'</small></div><h2>'+(pizza?'🍕 Picų meistrė':'🛒 Drakoniuko parduotuvė')+'</h2><div class="progress"><span style="width:'+((g.i+(g.locked?1:0))*20)+'%"></span></div><div class="mini-board"><h3>'+(pizza?'Pažymėk '+q.num+'/'+q.den+' picos.':'Nupirk maisto už lygiai '+miniMoney(q.target)+'.')+'</h3><p class="muted">'+(pizza?'Paliesk picos dalis arba mygtukus po pica.':'Keisk prekių kiekį mygtukais + ir −. Galimi keli teisingi krepšeliai.')+'</p>'+(pizza?miniPizza(q,g):miniMarket(q,g))+'</div>'+(g.feedback?'<p class="note '+(g.locked?'good':'warn')+'" role="status">'+esc(g.feedback)+'</p>':'')+'<div class="actions">'+(g.locked?'<button id="miniNext">'+(g.i===4?'Baigti žaidimą':'Kita užduotis →')+'</button>':'<button id="miniCheck">Patikrinti</button><button class="secondary" id="miniHint">💡 Užuomina</button><button class="secondary" id="miniReveal">Parodyti sprendimą</button>')+'</div><button class="secondary" id="miniPause" style="margin-top:16px">← Nuotykiai</button></section>');let toggle=i=>{if(g.locked)return;g.selected=g.selected.includes(i)?g.selected.filter(x=>x!==i):[...g.selected,i];g.feedback='';miniRender()};let adjust=(i,d)=>{if(g.locked||g.counts[i]+d<0||g.counts[i]+d>12)return;g.counts[i]+=d;g.feedback='';miniRender()};if(pizza){for(let i=0;i<q.den;i++)btn('piece-'+i,()=>toggle(i));for(let e of document.querySelectorAll('[data-piece]')){e.onclick=()=>toggle(Number(e.dataset.piece));e.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();toggle(Number(e.dataset.piece))}}}}else for(let i=0;i<3;i++){btn('minus-'+i,()=>adjust(i,-1));btn('plus-'+i,()=>adjust(i,1))}btn('miniCheck',()=>{g.attempts++;if(miniCorrect(q,g))miniCommit(true);else g.feedback=pizza?'Dar ne visai. Pabandyk pasirinkti kitą dalių skaičių.':miniTotal(q,g)>q.target?'Krepšelis per brangus. Sumažink prekių kiekį.':'Krepšelio suma per maža. Pridėk prekių.';miniRender()});btn('miniHint',()=>{g.hint=true;g.feedback=pizza?'Vardiklis rodo visas dalis, skaitiklis – kiek dalių reikia pažymėti.':'Palygink krepšelio sumą su tikslu. Keisk vienos prekės kiekį.';miniRender()});btn('miniReveal',()=>{g.hint=true;if(pizza)g.selected=Array.from({length:q.num},(_,i)=>i);else g.counts=[...q.solution];miniCommit(false);miniRender()});btn('miniNext',()=>{if(!g.locked)return;if(g.i===4){miniFinish(g);miniRender();return}g.i++;g.selected=[];g.counts=[0,0,0];g.attempts=0;g.hint=false;g.locked=false;g.feedback='';miniRender()});btn('miniPause',adventureMenu)}
