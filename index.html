<!DOCTYPE html><html lang="lt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mokslo nuotykiai | 4 klasė</title><style>
:root{--ink:#172d43;--muted:#53697d;--blue:#225f91;--bg:#eff5f7;--line:#d7e3e8;--green:#19684f;--gold:#a45c13}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 system-ui,sans-serif}header{background:#193d55;color:white;padding:24px 20px}header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.wrap,main{max-width:850px;margin:auto}h1,h2,h3,p{margin:0 0 14px}h1{font-size:28px;line-height:1.15}h2{font-size:25px}h3{font-size:19px}small,.muted{color:var(--muted);font-size:14px}header small{color:#d8eaf3}main{padding:24px 16px 50px}.panel{background:#fff;border:1px solid var(--line);border-radius:19px;padding:clamp(18px,4vw,32px);margin-bottom:16px;box-shadow:0 5px 18px #1a3b4c08}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.tile{border:1px solid var(--line);border-radius:13px;padding:18px;background:#f7fbfc;text-align:left;color:var(--ink);cursor:pointer;font:inherit;min-height:100px}.tile strong{display:block;font-size:18px;margin-bottom:5px}.tile:hover{border-color:var(--blue)}button,select,input,textarea{font:inherit}button{cursor:pointer;border-radius:10px;padding:11px 17px;border:1px solid transparent;background:var(--blue);color:white;font-weight:650}button.secondary{background:#fff;color:var(--blue);border-color:#b5cad9}button:disabled{opacity:.5;cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #f4ad4b;outline-offset:2px}input,textarea,select{border:1px solid #9eb5c4;border-radius:10px;padding:11px;color:var(--ink);background:white;max-width:100%}input{width:150px}textarea{width:100%;min-height:105px;resize:vertical}.actions,.fields,.top{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.top{justify-content:space-between}.field{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.field label{font-weight:600}.question{font-size:clamp(20px,4vw,26px);font-weight:650;line-height:1.45;margin:22px 0;white-space:pre-line}.tag{font-size:14px;color:var(--blue);font-weight:700}.progress{height:8px;background:#dfe9ef;border-radius:8px;overflow:hidden;margin:12px 0 24px}.progress span{display:block;background:#3185a1;height:100%;transition:width .2s}.note{padding:14px 16px;background:#eef5fb;border-left:4px solid #4783a6;border-radius:8px;margin:14px 0;white-space:pre-line}.good{background:#e8f6ee;border-color:#28845f}.warn{background:#fff4e4;border-color:#bd7c27}.diagram{margin:15px auto;max-width:340px;text-align:center}.diagram svg{width:100%;height:auto;max-height:230px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin:18px 0}.stat{background:#f1f6f9;padding:15px;border-radius:12px}.stat b{display:block;font-size:27px}.review{border-top:1px solid var(--line);padding:12px 0}.review summary{cursor:pointer;font-weight:600}.wrong{color:#a12f2f;text-decoration:line-through}.right{color:var(--green);font-weight:650}.footer{text-align:center;color:var(--muted);font-size:13px;margin-top:25px}.hidden{display:none}a{color:var(--blue)}@media(max-width:500px){.actions button{flex:1}input{width:110px}header{padding:20px 16px}}
</style></head><body><header><div class="wrap"><div><h1>Mokslo nuotykiai</h1><small>4 klasė • Kiekviena klaida padeda mokytis</small></div><button class="secondary" id="home">Pradžia</button></div></header><main id="app"></main><script>
'use strict';
const r=(a,b)=>Math.floor(Math.random()*(b-a+1))+a, pick=a=>a[r(0,a.length-1)], shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=r(0,i);[a[i],a[j]]=[a[j],a[i]]}return a}, frac=(n,d)=>`${n}/${d}`, money=n=>`${Math.floor(n/100)} Eur ${n%100} ct`, time=n=>`${Math.floor(n/60)} h ${n%60} min`, pad=n=>String(n).padStart(2,'0');
const F=(label,value,type='number')=>({label,value,type});const Q=(question,answer,hint,plan,solution,diagram='')=>({question,fields:Array.isArray(answer)?answer:[F('',answer)],hint,plan,solution,diagram});const T=[];function add(id,topic,level,make){T.push({id,topic,level,make})}
const M='Matavimo vienetai', A='Skaičiavimas', P='Pinigai', L='Laikas', FRC='Trupmenos', G='Geometrija', W='Tekstiniai uždaviniai', V='Greitis ir atstumas', N='Loginės užduotys';
add('add',A,'A',()=>{let a=r(22,480),b=r(15,390),c=r(11,89);return Q(`${a} + ${b} + ${c}` ,a+b+c,'Sudėk po du skaičius.','Pirma sudėk pirmus du, tada pridėk trečią.',`${a} + ${b} = ${a+b}\n${a+b} + ${c} = ${a+b+c}`)});
add('subtract',A,'A',()=>{let a=r(200,900),b=r(30,a-20);return Q(`${a} − ${b}`,a-b,'Atimk šimtus, dešimtis ir vienetus.','Gali suskaidyti antrą skaičių į patogias dalis.',`${a} − ${b} = ${a-b}`)});
add('order',A,'A',()=>{let a=r(3,9),b=r(3,9),c=r(10,90);return Q(`${a} · ${b} + ${c}`,a*b+c,'Daugyba atliekama prieš sudėtį.','Pirma daugink, paskui pridėk.',`${a} · ${b} = ${a*b}\n${a*b} + ${c} = ${a*b+c}`)});
add('divide',A,'A',()=>{let a=r(3,9),b=r(8,90);return Q(`${a*b} : ${a}`,b,'Koks skaičius padaugintas iš daliklio duotų dalinį?','Padalyk dalinį iš daliklio.',`${a*b} : ${a} = ${b}, nes ${b} · ${a} = ${a*b}.`)});
add('remainder',A,'A',()=>{let d=r(3,9),q=r(3,12),m=r(1,d-1);return Q(`Padalyk ${d*q+m} iš ${d}.`,[F('Dalmuo',q),F('Liekana',m)],'Rask didžiausią daliklio kartotinį, neviršijantį dalinio.','Nustatyk, kiek pilnų grupių galima sudaryti ir kiek lieka.',`${d} · ${q} = ${d*q}\n${d*q+m} − ${d*q} = ${m}\nDalmuo ${q}, liekana ${m}.`)});
add('unknown',A,'A',()=>{let a=r(110,390),b=r(60,260);return Q(`□ + ${a} = ${a+b}`,b,'Nežinomą dėmenį rasi iš sumos atėmusi žinomą dėmenį.','Atimk.',`${a+b} − ${a} = ${b}`)});
add('length',M,'A',()=>{let a=r(2,15),b=r(1,9);return Q(`${a} cm ${b} mm = ? mm`,[F('mm',a*10+b)],'1 cm = 10 mm.','Centimetrus paversk milimetrais ir pridėk likusius.',`${a} · 10 + ${b} = ${a*10+b} mm`)});
add('length2',M,'A',()=>{let a=r(2,8),b=r(11,95);return Q(`${a*100+b} cm = ? m ? cm`,[F('m',a),F('cm',b)],'1 m = 100 cm.','Atskirk pilnus šimtus centimetrų.',`${a*100+b} cm = ${a} m ${b} cm`)});
add('mass',M,'A',()=>{let a=r(2,9),b=r(1,9)*100;return Q(`${a} kg ${b} g = ? g`,[F('g',a*1000+b)],'1 kg = 1000 g.','Padaugink kilogramus iš 1000 ir pridėk gramus.',`${a} · 1000 + ${b} = ${a*1000+b} g`)});
add('seconds',L,'A',()=>{let a=r(2,9),b=r(5,55);return Q(`${a} min ${b} s = ? s`,[F('s',a*60+b)],'1 minutė = 60 sekundžių.','Minutes padaugink iš 60, pridėk sekundes.',`${a} · 60 + ${b} = ${a*60+b} s`)});
add('hours',L,'A',()=>{let a=r(1,5),b=r(10,59);return Q(`${a} h ${b} min = ? min`,[F('min',a*60+b)],'1 valanda = 60 minučių.','Valandas paversk minutėmis.',`${a} · 60 + ${b} = ${a*60+b} min`)});
add('calendar',L,'A',()=>{let a=r(2,12);return Q(`Kiek dienų yra per ${a} sav.?`,[F('dienų',a*7)],'Savaitėje yra 7 dienos.','Savaičių skaičių daugink iš 7.',`${a} · 7 = ${a*7} dienų`)});
add('cents',P,'A',()=>{let a=r(110,899);return Q(`${a} ct = ? Eur ? ct`,[F('Eur',Math.floor(a/100)),F('ct',a%100)],'100 ct = 1 Eur.','Atskirk pilnus šimtus centų.',`${a} ct = ${money(a)}`)});
add('moneyadd',P,'A',()=>{let a=r(51,99),b=r(51,99),s=a+b;return Q(`${a} ct + ${b} ct = ? Eur ? ct`,[F('Eur',Math.floor(s/100)),F('ct',s%100)],'Pirma sudėk centus.','Jei susidarė 100 centų, pakeisk juos euru.',`${a} + ${b} = ${s} ct = ${money(s)}`)});
add('fraction',FRC,'B',()=>{let d=pick([3,4,5,6,7,8,9]),n=r(1,d-1),k=r(8,45),a=d*k;return Q(`Rask ${frac(n,d)} skaičiaus ${a}.`,n*k,'Vardiklis rodo, į kiek lygių dalių dalijame; skaitiklis – kiek imame.','Padalyk iš vardiklio, padaugink iš skaitiklio.',`${a} : ${d} = ${k}\n${k} · ${n} = ${n*k}`)});
add('reducefraction',FRC,'B',()=>{let d=pick([3,4,5,6]),n=r(1,d-1),k=r(10,80),a=d*k;return Q(`Skaičių ${a} sumažink jo ${frac(n,d)} dalimi.`,a-n*k,'Rasti skaičiaus dalį ir sumažinti skaičių ta dalimi – skirtingi veiksmai.','Rask nurodytą dalį ir atimk ją iš viso skaičiaus.',`${a} : ${d} · ${n} = ${n*k}\n${a} − ${n*k} = ${a-n*k}`)});
add('fractionmass',FRC,'B',()=>{let d=pick([2,4,5,10]),n=r(1,d-1),b=r(1,8)*50,a=1000/d*n;return Q(`Rask ${frac(n,d)} kg ir ${b} g sumą.`,[F('g',a+b)],'1 kg = 1000 g.','Rask kilogramo dalį gramais, tada pridėk.',`1000 : ${d} · ${n} = ${a} g\n${a} + ${b} = ${a+b} g`)});
add('fractiontime',FRC,'B',()=>{let d=pick([2,3,4,5,6]),n=r(1,d-1),b=r(10,50),a=60/d*n;return Q(`Prie ${frac(n,d)} h pridėk ${b} min.`,[F('min',a+b)],'Valandą sudaro 60 minučių.','Rask valandos dalį ir pridėk minutes.',`60 : ${d} · ${n} = ${a} min\n${a} + ${b} = ${a+b} min`)});
add('quotient',A,'B',()=>{let d=r(4,12),q=r(3,16),a=d*q;return Q(`Dalinys – ${a}, daliklis ${q} kartus mažesnis. Rask dalmenį.`,q,'Dalinys – skaičius, kurį dalijame. Daliklis – skaičius, iš kurio dalijame.','Rask daliklį, po to padalyk dalinį iš jo.',`${a} : ${q} = ${d} (daliklis)\n${a} : ${d} = ${q} (dalmuo)`)});
add('compare',A,'B',()=>{let a=r(12,60),b=r(3,a-1);return Q(`Kiek skaičių ${a} ir ${b} suma didesnė už jų skirtumą?`,2*b,'Reikia apskaičiuoti dvi reikšmes ir jas palyginti.','Rask sumą, skirtumą ir iš sumos atimk skirtumą.',`${a} + ${b} = ${a+b}\n${a} − ${b} = ${a-b}\n${a+b} − ${a-b} = ${2*b}`)});
add('perimeter',G,'B',()=>{let a=r(4,24);return Q(`Kvadrato perimetras – ${4*a} cm. Koks jo kraštinės ilgis?`,[F('cm',a)],'Kvadratas turi keturias lygias kraštines.','Perimetrą padalyk iš 4.',`${4*a} : 4 = ${a} cm`)});
add('area',G,'B',()=>{let a=r(5,18),b=r(3,a-1);return Q(`Stačiakampio ilgis – ${a} cm, plotis – ${b} cm. Koks plotas?`,[F('cm²',a*b)],'Plotui rasti dauginame ilgį iš pločio.','Padaugink abi kraštines.',`${a} · ${b} = ${a*b} cm²`,`<svg viewBox="0 0 260 135" role="img" aria-label="Stačiakampis"><rect x="38" y="30" width="160" height="75" fill="#c8e6f0" stroke="#225f91" stroke-width="2"/><text x="118" y="23" text-anchor="middle">${a} cm</text><text x="204" y="72">${b} cm</text></svg>`)});
add('radius',G,'B',()=>{let a=r(8,45);return Q(`Apskritimo skersmuo – ${a*2} cm. Rask spindulį.`,[F('cm',a)],'Skersmuo – du spinduliai.','Padalyk skersmenį iš 2.',`${a*2} : 2 = ${a} cm`)});
add('sequence',N,'B',()=>{let a=r(12,60),d=r(3,12);return Q(`Rask trūkstamą sekos narį:\n${a}, ${a+d}, □, ${a+3*d}, ${a+4*d}`,a+2*d,'Palygink du gretimus skaičius.','Rask pastovų skirtumą ir pridėk prie antro skaičiaus.',`${a+d} − ${a} = ${d}\n${a+d} + ${d} = ${a+2*d}`)});
add('average',N,'B',()=>{let a=r(12,50),d=r(2,9);return Q(`Rask skaičių ${a-d}, ${a}, ${a+d} vidurkį.`,a,'Vidurkis – suma, padalyta iš skaičių kiekio.','Sudėk tris skaičius, tada padalyk iš 3.',`${a-d} + ${a} + ${a+d} = ${3*a}\n${3*a} : 3 = ${a}`)});
add('difference',W,'B',()=>{let a=r(110,250),b=r(25,60),c=r(20,45);return Q(`Bibliotekoje buvo ${a} knygų. Pirmą dieną skaitytojai pasiskolino ${b}, antrą – ${c}. Kiek knygų liko?`,[F('knygų',a-b-c)],'Kiek knygų iš viso pasiskolino?','Sudėk abiejų dienų kiekius ir atimk iš pradinio kiekio.',`${b} + ${c} = ${b+c}\n${a} − ${b+c} = ${a-b-c}`)});
add('unitprice',P,'B',()=>{let a=r(3,9),p=r(2,8)*25;return Q(`Vienodi sąsiuviniai (${a} vnt.) kainuoja ${money(a*p)}. Kiek kainuoja vienas sąsiuvinis?`,[F('ct',p)],'Visi sąsiuviniai kainuoja vienodai.','Visą kainą paversk centais ir padalyk iš sąsiuvinių skaičiaus.',`${money(a*p)} = ${a*p} ct\n${a*p} : ${a} = ${p} ct`)});
add('elapsed',L,'B',()=>{let a=r(8,14)*60+r(0,5)*10,b=r(4,25)*10;return Q(`Pamoka prasidėjo ${pad(Math.floor(a/60))}:${pad(a%60)}. Po ${b} min ji baigėsi. Kokį laiką rodė laikrodis?`,[F('h',Math.floor((a+b)/60)),F('min',(a+b)%60)],'Kas 60 minučių pasikeičia valanda.','Prie pradžios laiko pridėk minutes, prireikus paversk jas valandomis.',`${time(a)} + ${b} min = ${time(a+b)}`)});
function clock(h,m){let line=(ang,len,w)=>`<line x1="100" y1="100" x2="${100+len*Math.sin(ang)}" y2="${100-len*Math.cos(ang)}" stroke="#173c55" stroke-width="${w}" stroke-linecap="round"/>`;return `<svg viewBox="0 0 200 200" role="img" aria-label="Analoginis laikrodis"><circle cx="100" cy="100" r="92" fill="#f3f9fc" stroke="#225f91" stroke-width="3"/>${Array.from({length:12},(_,i)=>{let n=i+1,a=n*Math.PI/6;return `<text x="${100+74*Math.sin(a)}" y="${105-74*Math.cos(a)}" text-anchor="middle" font-size="14">${n}</text>`}).join('')}${line((h%12+m/60)*Math.PI/6,43,6)}${line(m*Math.PI/30,65,3)}<circle cx="100" cy="100" r="4" fill="#173c55"/></svg>`}
add('clock',L,'C',()=>{let h=r(14,21),m=r(0,11)*5,d=r(7,19),a=h*60+m-d;return Q(`Šis laikrodis rodo popietės laiką ir skuba ${d} min. Koks tikslus laikas?`,[F('h (24 val. formatu)',Math.floor(a/60)),F('min',a%60)],'Skubantis laikrodis rodo vėlesnį laiką negu tikrasis.','Nuskaityk laikrodį ir atimk nurodytas minutes.',`Laikrodis rodo ${time(h*60+m)}.\nAtėmus ${d} min gauname ${time(a)}.`,clock(h,m))});
add('shaded',FRC,'C',()=>{let d=r(5,10),n=r(2,d-1);return Q('Kokia juostos dalis nuspalvinta? Kokia nenuspalvinta? Atsakyk trupmenomis, pvz., 1/3.',[F('Nuspalvinta',n/d,'fraction'),F('Nenuspalvinta',(d-n)/d,'fraction')],'Suskaičiuok visas lygias dalis ir nuspalvintas dalis.','Vardiklis – visų dalių skaičius; skaitiklis – pasirinktų dalių skaičius.',`Iš viso ${d} dalių. Nuspalvinta ${n}, nenuspalvinta ${d-n}.\nAtsakymai: ${n}/${d} ir ${d-n}/${d}.`,`<svg viewBox="0 0 ${d*30+10} 55" role="img" aria-label="Į lygias dalis padalyta juosta">${shuffle(Array.from({length:d},(_,i)=>i<n)).map((x,i)=>`<rect x="${5+i*30}" y="10" width="30" height="35" fill="${x?'#478caa':'#fff'}" stroke="#225f91"/>`).join('')}</svg>`)});
add('trianglearea',G,'C',()=>{let a=pick([4,6,8]);let lines=Array.from({length:a+1},(_,i)=>`<path d="M${20+i*20} 20 V${20+a*20} M20 ${20+i*20} H${20+a*20}" stroke="#a4bccb" fill="none"/>`).join('');return Q('Kiek vienetinių kvadratėlių užima nuspalvinto trikampio plotas?', [F('kvadratėlių',a*a/2)],'Trikampis užima lygiai pusę kvadrato.','Suskaičiuok, kiek kvadratėlių užima visas kvadratas, ir padalyk iš 2.',`${a} · ${a} = ${a*a}\n${a*a} : 2 = ${a*a/2}`,`<svg viewBox="0 0 ${40+a*20} ${40+a*20}" role="img" aria-label="Kvadratas su tinkleliu, viena įstrižainės pusė nuspalvinta"><path d="M20 ${20+a*20} H${20+a*20} V20 Z" fill="#a9d9e8"/>${lines}<path d="M20 ${20+a*20} H${20+a*20} V20 Z" stroke="#225f91" stroke-width="2" fill="none"/></svg>`)});
add('speed',V,'C',()=>{let v=r(5,11)*10,t=r(2,6);return Q(`Automobilis per ${t} h nuvažiavo ${v*t} km. Kokiu pastoviu greičiu jis važiavo?`,[F('km/h',v)],'Greitis – per vieną valandą nuvažiuotas atstumas.','Atstumą padalyk iš laiko.',`${v*t} : ${t} = ${v} km/h`)});
add('travel',V,'C',()=>{let v=r(4,9)*10,a=r(3,6),b=r(1,2);return Q(`Autobusas per ${a} h nuvažiavo ${a*v} km. Kiek kilometrų nuvažiuos per ${b} h tokiu pačiu greičiu?`,[F('km',b*v)],'Pirma rask, kiek nuvažiuoja per 1 valandą.','Padalyk atstumą iš laiko, tada padaugink iš naujo laiko.',`${a*v} : ${a} = ${v} km/h\n${v} · ${b} = ${b*v} km`)});
add('river',V,'C',()=>{let v=r(12,20),c=r(2,5),t=r(2,4);return Q(`Valties greitis stovinčiame vandenyje – ${v} km/h, upės srovės – ${c} km/h. Kiek kilometrų valtis nuplauks per ${t} h pasroviui ir prieš srovę?`,[F('Pasroviui, km',(v+c)*t),F('Prieš srovę, km',(v-c)*t)],'Srovė padeda plaukiant pasroviui ir trukdo plaukiant prieš srovę.','Pridėk arba atimk srovės greitį, tada daugink iš laiko.',`Pasroviui: (${v} + ${c}) · ${t} = ${(v+c)*t} km\nPrieš srovę: (${v} − ${c}) · ${t} = ${(v-c)*t} km`)});
add('shopping',W,'C',()=>{let a=r(3,8),b=r(2,6),p=r(3,9)*10,s=r(2,8)*10,total=a*p+b*s;return Q(`Ieva nusipirko bandelių (${a} vnt. po ${p} ct) ir pyragėlių (${b} vnt. po ${s} ct). Kiek sumokėjo?`,[F('Eur',Math.floor(total/100)),F('ct',total%100)],'Apskaičiuok kiekvienos rūšies pirkinių kainą atskirai.','Padaugink kiekius iš kainų, sudėk, paversk eurais ir centais.',`${a} · ${p} = ${a*p} ct\n${b} · ${s} = ${b*s} ct\n${a*p} + ${b*s} = ${total} ct = ${money(total)}`)});
add('whole',FRC,'C',()=>{let d=r(3,8),k=r(6,40);return Q(`Ema išleido 1/${d} visų savo pinigų, tai yra ${k} Eur. Kiek pinigų ji turėjo?`,[F('Eur',d*k)],'Žinai vienos lygios dalies vertę, reikia rasti visas dalis.','Vienos dalies vertę padaugink iš vardiklio.',`${k} · ${d} = ${k*d} Eur`)});
add('change',P,'C',()=>{let a=r(2,5),p=r(4,12)*25,b=Math.ceil((a*p+100)/500)*500,c=b-a*p;return Q(`Nupirkta knygelių: ${a} vnt. po ${money(p)}. Paduota ${b/100} Eur. Kiek grąžos turi gauti pirkėjas?`,[F('Eur',Math.floor(c/100)),F('ct',c%100)],'Pirma rask visų knygelių kainą.','Padaugink kiekį iš kainos centais, tada atimk iš sumokėtų pinigų.',`${a} · ${p} = ${a*p} ct\n${b} − ${a*p} = ${c} ct = ${money(c)}`)});

const app=typeof document!=='undefined'?document.getElementById('app'):null;

const levels={A:'Apšilimas',B:'Pagrindinis',C:'Iššūkis'};let storageOK=true;
function load(){try{let x=JSON.parse(localStorage.getItem('mokslo-v1')||'null');return x&&Array.isArray(x.math)&&Array.isArray(x.lt)?x:{math:[],lt:[]}}catch(e){storageOK=false;return {math:[],lt:[]}}}

let session=null,dict=null;function cancelSpeech(){if(typeof speechSynthesis!=='undefined')speechSynthesis.cancel()}

function btn(id,fn){document.getElementById(id)?.addEventListener('click',fn)}
function home(){cancelSpeech();session=null;dict=null;view(`<section class="panel"><p class="tag">TAVO MOKYMOSI ERDVĖ</p><h2>Ką šiandien mokysimės?</h2><p>Rinkis dalyką. Mokykis savo tempu ir išbandyk naujus iššūkius.</p><div class="tiles"><button class="tile" id="math"><strong>➗ Matematika</strong>Uždaviniai, skaičiavimai ir loginiai iššūkiai.</button><button class="tile" id="lt"><strong>✎ Lietuvių kalba</strong>Sakinių diktantai ir rašybos pratybos.</button><button class="tile" id="stats"><strong>☆ Mano pažanga</strong>Peržiūrėk rezultatus ir pasikartok klaidas.</button></div></section>`);btn('math',mathMenu);btn('lt',ltMenu);btn('stats',stats)}
function mathMenu(){view(`<section class="panel"><p class="tag">MATEMATIKA</p><h2>Pasirink treniruotę</h2><div class="tiles"><button class="tile" id="daily"><strong>Dienos treniruotė</strong>10 užduočių: 3 A, 5 B, 2 C. Su pagalba.</button><button class="tile" id="test"><strong>Kontrolinis testas</strong>10 užduočių. Atsakymai tik pabaigoje.</button><button class="tile" id="retry"><strong>Klaidų kartojimas</strong>Nauji uždaviniai iš sunkiau sekusių temų.</button></div><hr style="border:0;border-top:1px solid var(--line);margin:24px 0"><h3>Mokymasis pagal temą</h3><div class="actions"><select id="topic" aria-label="Tema">${[...new Set(T.map(t=>t.topic))].map(t=>`<option>${t}</option>`).join('')}</select><button id="theme">Pradėti 10 užduočių</button></div></section>`);btn('daily',()=>startMath('daily'));btn('test',()=>startMath('test'));btn('retry',()=>startMath('retry'));btn('theme',()=>startMath('topic',document.getElementById('topic').value))}
function chooseTasks(mode,topic){let missed=new Map();history.math.forEach(x=>{if(!x.independent)missed.set(x.id,(missed.get(x.id)||0)+1);else missed.set(x.id,Math.max(0,(missed.get(x.id)||0)-1))});let used=new Set(),seen=new Set(),out=[];const choose=(pool)=>{let fresh=pool.filter(t=>!used.has(t.id));let t=pick(fresh.length?fresh:pool);used.add(t.id);let q=t.make();for(let i=0;i<25&&seen.has(q.question+q.diagram);i++)q=t.make();seen.add(q.question+q.diagram);out.push({...q,id:t.id,level:t.level,topic:t.topic})};if(mode==='topic'){let pool=T.filter(t=>t.topic===topic);for(let i=0;i<10;i++)choose(pool)}else if(mode==='retry'&&[...missed.values()].some(v=>v>0)){let pool=T.filter(t=>missed.get(t.id)>0);for(let i=0;i<10;i++)choose(pool)}else{for(let level of ['A','B','C'])for(let i=0;i<({A:3,B:5,C:2}[level]);i++)choose(T.filter(t=>t.level===level))}return out}
function startMath(mode,topic){session={mode,qs:chooseTasks(mode,topic),i:0,records:[],hint:0,attempts:0,feedback:'',locked:false,values:[],finished:false};renderMath()}
function parseValue(s,type){s=s.trim().replace(',','.');if(type==='fraction'){let m=s.match(/^(\d+)\s*\/\s*(\d+)$/);return m&&Number(m[2])>0?Number(m[1])/Number(m[2]):NaN}return /^-?\d+(\.\d+)?$/.test(s)?Number(s):NaN}
function matches(s,f){return Math.abs(parseValue(s,f.type)-f.value)<1e-8}
function readFields(){session.values=[...app.querySelectorAll('[data-answer]')].map(x=>x.value)}
function renderMath(){let s=session,q=s.qs[s.i],test=s.mode==='test';view(`<section class="panel"><div class="top"><span class="tag">${test?'KONTROLINIS TESTAS':q.topic.toUpperCase()}</span><small>${s.i+1} / ${s.qs.length} · ${q.level} – ${levels[q.level]}</small></div><div class="progress" aria-label="Pažanga"><span style="width:${(s.i+1)/s.qs.length*100}%"></span></div><div class="question">${esc(q.question)}</div>${q.diagram?`<div class="diagram">${q.diagram}</div>`:''}<form id="answerForm"><div class="fields">${q.fields.map((f,i)=>`<div class="field"><label for="a${i}">${esc(f.label||'Atsakymas')}</label><input id="a${i}" data-answer type="text" inputmode="${f.type==='fraction'?'text':'decimal'}" autocomplete="off" spellcheck="false" value="${esc(s.values[i]||'')}" ${s.locked?'disabled':''}></div>`).join('')}</div><div class="actions" style="margin-top:20px">${s.locked?'<button type="button" id="next">Kita užduotis →</button>':`<button type="submit">${test?'Išsaugoti ir tęsti':'Patikrinti atsakymą'}</button>`}${!s.locked&&!test?'<button type="button" class="secondary" id="skip">Praleisti</button>':''}</div></form>${s.feedback?`<div role="status" class="note ${s.locked?'good':'warn'}">${esc(s.feedback)}</div>`:''}${!test?`${s.hint>=1?`<div class="note"><b>1. Kaip mąstyti?</b><br>${esc(q.hint)}</div>`:''}${s.hint>=2?`<div class="note"><b>2. Sprendimo planas</b><br>${esc(q.plan)}</div>`:''}${s.hint>=3?`<div class="note"><b>3. Visas sprendimas</b><br>${esc(q.solution)}</div>`:''}${!s.locked&&s.hint<3?`<button class="secondary" id="hint">${['💡 Padėk suprasti','Parodyk sprendimo planą','Parodyk visą sprendimą'][s.hint]}</button>`:''}`:''}</section>`);
 document.getElementById('answerForm').addEventListener('submit',e=>{e.preventDefault();readFields();if(s.values.some(x=>!x.trim())){s.feedback='Įrašyk atsakymą į kiekvieną laukelį.';renderMath();return}if(s.values.some((x,i)=>!Number.isFinite(parseValue(x,q.fields[i].type)))){s.feedback='Patikrink atsakymo formatą. Trupmeną rašyk, pavyzdžiui, 1/3.';renderMath();return}s.attempts++;let correct=q.fields.every((f,i)=>matches(s.values[i],f));if(test){record(correct);advance();return}if(correct){s.locked=true;s.feedback=s.hint?'Puiku, išsprendei su pagalba!':'Puiku! Atsakymas teisingas. ✨';record(true)}else{s.feedback='Dar ne visai. Pabandyk dar kartą arba pasinaudok užuomina.'}renderMath()});btn('hint',()=>{readFields();s.hint++;renderMath()});btn('skip',()=>{readFields();record(false);advance()});btn('next',advance)}
function record(correct){let s=session,q=s.qs[s.i];s.records.push({id:q.id,topic:q.topic,level:q.level,correct,independent:correct&&s.hint===0&&s.attempts===1,hint:s.hint,attempts:s.attempts,values:[...s.values],question:q.question,solution:q.solution,date:new Date().toISOString()})}
function advance(){let s=session;s.i++;if(s.i>=s.qs.length){finishMath();return}s.hint=0;s.attempts=0;s.feedback='';s.locked=false;s.values=[];renderMath()}
function finishMath(){let s=session;if(!s.finished){history.math.push(...s.records.map(({id,topic,level,correct,independent,hint,attempts,date})=>({id,topic,level,correct,independent,hint,attempts,date})));save();s.finished=true}let n=s.records.length,correct=s.records.filter(x=>x.correct).length,ind=s.records.filter(x=>x.independent).length;view(`<section class="panel"><p class="tag">TRENIRUOTĖ BAIGTA</p><h2>Puikiai padirbėta!</h2><div class="stats"><div class="stat"><b>${correct}/${n}</b>Teisingai</div><div class="stat"><b>${ind}/${n}</b>Savarankiškai iš pirmo karto</div><div class="stat"><b>${n-ind}</b>Verta pakartoti</div></div><h3>Peržiūrėk sprendimus</h3>${s.records.map((x,i)=>`<details class="review" ${x.independent?'':'open'}><summary>${i+1}. ${x.independent?'✓':x.correct?'Su pagalba / po bandymo':'Dar pasimokysime'} · ${esc(x.topic)}</summary><p>${esc(x.question)}</p><p>Tavo atsakymas: ${esc(x.values.join(', ')||'neįrašytas')}</p><div class="note">${esc(x.solution)}</div></details>`).join('')}<div class="actions"><button id="again">Nauja treniruotė</button><button id="repeat" class="secondary">Kartoti klaidas</button><button id="stat" class="secondary">Pažanga</button></div></section>`);btn('again',mathMenu);btn('repeat',()=>startMath('retry'));btn('stat',stats)}

function getVoice(){return typeof speechSynthesis==='undefined'?null:speechSynthesis.getVoices().find(v=>/^lt(?:-|_|$)/i.test(v.lang))||null}
function ltMenu(){cancelSpeech();view(`<section class="panel"><p class="tag">LIETUVIŲ KALBA · PRADINIS RINKINYS</p><h2>Diktantų treniruotė</h2><p>Pagrindinis režimas – rišlūs tekstai, diktuojami sakiniais. Rašyk klaviatūra.</p><div class="note ${getVoice()?'good':'warn'}" id="voiceinfo">${getVoice()?'Lietuviškas balsas rastas.':'Lietuviškas balsas dar nerastas. Jei jis nepasirodys, diktavimo funkcijai įrenginyje reikės lietuviško balso.'}</div><div class="tiles"><button class="tile" id="sentences"><strong>Sakinių diktantas</strong>5 tarpusavyje susiję sakiniai.</button><button class="tile" id="word"><strong>Žodžių diktantas</strong>10 įsimintinų ir sudėtingesnių žodžių.</button><button class="tile" id="ltretry"><strong>Rašybos kartojimas</strong>Diktanto žodžiai, kuriuos verta pakartoti.</button></div></section>`);btn('sentences',()=>startDict('text'));btn('word',()=>startDict('word'));btn('ltretry',()=>startDict('retry'))}

function speak(text){let voice=getVoice(),status=document.getElementById('speechStatus');if(!voice){status.textContent='Šiuo metu lietuviško balso nėra. Galima įdiegti lietuvišką sistemos balsą arba diktantą perskaityti kitam žmogui.';return}cancelSpeech();let u=new SpeechSynthesisUtterance(text);u.voice=voice;u.lang='lt-LT';u.rate=dict.rate;u.onerror=()=>{if(status.isConnected)status.textContent='Garso atkurti nepavyko. Patikrink įrenginio garso nustatymus.'};speechSynthesis.speak(u);status.textContent='Klausyk ir rašyk.'}
function storeDict(){let e=document.getElementById('written');if(e)dict.answers[dict.i]=e.value}
function renderDict(){let d=dict;view(`<section class="panel"><div class="top"><span class="tag">DIKTANTAS</span><small>${d.i+1} / ${d.items.length}</small></div><h2>${esc(d.title)}</h2><div class="progress"><span style="width:${(d.i+1)/d.items.length*100}%"></span></div><p>Klausyk ${d.mode==='text'?'sakinio':'žodžio'} ir užrašyk. Teisingas tekstas pasirodys tik baigus.</p><div class="actions"><button id="play">▶ Klausyti / pakartoti</button><button class="secondary" id="stop">■ Sustabdyti</button>${d.mode==='text'?'<button class="secondary" id="whole">Visas tekstas</button>':''}<label>Greitis <select id="rate"><option value="0.65">Lėtai</option><option value="0.8">Ramiai</option><option value="1">Įprastai</option></select></label></div><p class="muted" id="speechStatus" role="status" style="margin-top:10px">${getVoice()?'Paspausk „Klausyti“.':'Jei lietuviško balso nėra, diktantas balsu neveiks šiame įrenginyje.'}</p><label for="written">Tavo tekstas</label><textarea id="written" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" placeholder="Rašyk čia…">${esc(d.answers[d.i])}</textarea><div class="actions"><button class="secondary" id="prev" ${d.i===0?'disabled':''}>← Ankstesnis</button><button id="dn">${d.i===d.items.length-1?'Patikrinti diktantą':'Kitas →'}</button></div></section>`);let rate=document.getElementById('rate');rate.value=String(d.rate);rate.onchange=()=>{d.rate=Number(rate.value)};btn('play',()=>speak(d.items[d.i]));btn('stop',cancelSpeech);btn('whole',()=>speak(d.items.join(' ')));btn('prev',()=>{storeDict();cancelSpeech();d.i--;renderDict()});btn('dn',()=>{storeDict();cancelSpeech();if(d.i<d.items.length-1){d.i++;renderDict()}else if(d.answers.some(x=>!x.trim())){document.getElementById('speechStatus').textContent='Dar yra tuščių atsakymų. Grįžk ir juos užpildyk.'}else finishDict()})}
const norm=s=>s.normalize('NFC').trim().replace(/\s+/g,' ').replace(/[“”„]/g,'"').replace(/[–—]/g,'-');const tokens=s=>norm(s).toLowerCase().match(/[\p{L}]+/gu)||[];
function align(a,b){let n=a.length,m=b.length,dp=Array.from({length:n+1},()=>Array(m+1).fill(0));for(let i=0;i<=n;i++)dp[i][0]=i;for(let j=0;j<=m;j++)dp[0][j]=j;for(let i=1;i<=n;i++)for(let j=1;j<=m;j++)dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1));let out=[],i=n,j=m;while(i||j){if(i&&j&&dp[i][j]===dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1)){out.push({expected:a[i-1],actual:b[j-1],ok:a[i-1]===b[j-1]});i--;j--}else if(i&&dp[i][j]===dp[i-1][j]+1){out.push({expected:a[--i],actual:'',ok:false})}else{out.push({expected:'',actual:b[--j],ok:false})}}return out.reverse()}
function finishDict(){let d=dict,results=d.items.map((x,i)=>({expected:x,actual:d.answers[i],exact:norm(x)===norm(d.answers[i]),diff:align(tokens(x),tokens(d.answers[i]))})),missed=results.flatMap(x=>x.diff.filter(z=>!z.ok&&z.expected).map(z=>z.expected)),errors=results.flatMap(x=>x.diff).filter(x=>!x.ok).length,total=d.items.reduce((n,x)=>n+tokens(x).length,0),exact=results.filter(x=>x.exact).length;if(!d.finished){history.lt.push({date:new Date().toISOString(),total,errors,exact,count:results.length,missed});save();d.finished=true}view(`<section class="panel"><h2>Diktantas baigtas!</h2><div class="stats"><div class="stat"><b>${exact}/${results.length}</b>Visiškai tikslūs įrašai</div><div class="stat"><b>${errors}</b>Žodžių neatitikimai</div><div class="stat"><b>${total}</b>Žodžiai diktante</div></div><p class="muted">Rašyba lyginama žodžiais, o didžiosios raidės ir skyryba – palyginant visą įrašą. Kablelių ar ženklų vietas pasitikrink pagal originalą.</p>${results.map((x,i)=>`<div class="review"><b>${i+1}. ${x.exact?'✓ Teisingai':'Pasitikrink'}</b><p>Tavo tekstas: ${esc(x.actual)}</p>${!x.exact?`<p class="right">Teisingai: ${esc(x.expected)}</p>${x.diff.filter(z=>!z.ok).map(z=>`<p><span class="wrong">${esc(z.actual||'praleista')}</span> → <span class="right">${esc(z.expected||'papildomas žodis')}</span>${rules[z.expected]?`<br><small>${esc(rules[z.expected])}</small>`:''}</p>`).join('')}${x.diff.every(z=>z.ok)?'<small>Patikrink didžiąsias raides arba skyrybos ženklus.</small>':''}`:''}</div>`).join('')}<div class="actions"><button id="more">Naujas diktantas</button><button class="secondary" id="repeatlt">Kartoti rašybą</button></div></section>`);btn('more',ltMenu);btn('repeatlt',()=>startDict('retry'))}
function stats(){cancelSpeech();let m=history.math,l=history.lt,ind=m.filter(x=>x.independent).length;let by=[...new Set(T.map(x=>x.topic))].map(t=>{let a=m.filter(x=>x.topic===t);return {t,n:a.length,p:a.length?Math.round(a.filter(x=>x.independent).length/a.length*100):null}});view(`<section class="panel"><h2>Mano pažanga</h2><div class="stats"><div class="stat"><b>${m.length}</b>Matematikos užduotys</div><div class="stat"><b>${m.length?Math.round(ind/m.length*100)+'%':'–'}</b>Savarankiškai iš pirmo karto</div><div class="stat"><b>${l.length}</b>Diktantai</div></div><h3>Matematikos temos</h3>${by.map(x=>`<div style="margin:14px 0"><div class="top"><span>${esc(x.t)}</span><small>${x.n?`${x.p}% · ${x.n} užd.`:'Dar nepradėta'}</small></div><div class="progress" style="margin:5px 0"><span style="width:${x.p||0}%"></span></div></div>`).join('')}<h3>Rašybos kartojimas</h3><p>${esc([...new Set(l.flatMap(x=>x.missed||[]))].slice(-20).join(', ')||'Dar nėra rezultatų.')}</p><div class="actions"><button id="practice">Kartoti matematikos klaidas</button><button class="secondary" id="practiceLt">Kartoti rašybą</button></div></section>`);btn('practice',()=>startMath('retry'));btn('practiceLt',()=>startDict('retry'))}
if(app){document.getElementById('home').onclick=home;if(typeof speechSynthesis!=='undefined')speechSynthesis.addEventListener('voiceschanged',()=>{let x=document.getElementById('voiceinfo');if(x&&getVoice()){x.textContent='Lietuviškas balsas rastas.';x.className='note good'}});home()}
if(typeof module!=='undefined')module.exports={T,chooseTasks,parseValue,matches,align};
</script></body></html>
